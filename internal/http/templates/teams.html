{{define "teams-content"}}
<div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-3">
  <div>
    <h1 class="h3 mb-0">OKR команд</h1>
    <p class="text-muted mb-0">Навигация по иерархии команд и целям периода.</p>
  </div>
  <div class="d-flex flex-wrap align-items-end gap-2">
    <a class="btn btn-outline-secondary btn-sm" href="/periods">Периоды</a>
    <a class="btn btn-primary btn-sm" href="/teams">Управление командами</a>
  </div>
</div>

<div id="teams-page" data-page="team-okrs" data-selected-team="{{.SelectedTeam}}" data-period-id="{{.SelectedPeriod}}">
  <div class="team-okrs-layout d-flex flex-column flex-lg-row gap-3 gap-lg-4">
    <aside class="team-okrs-sidebar" data-team-sidebar>
      <div class="card h-100">
        <div class="card-body">
          <div class="mb-3">
            <h2 class="h6 mb-2">Период</h2>
            <select name="period_id" class="form-select form-select-sm" data-period-select>
              {{range .PeriodOptions}}
              <option value="{{.ID}}" {{if .Selected}}selected{{end}}>{{.Name}}</option>
              {{end}}
            </select>
          </div>
          <div class="d-flex justify-content-between align-items-center mb-2">
            <h2 class="h6 mb-0">Иерархия команд</h2>
          </div>
          <div class="vstack gap-2 team-hierarchy-scroll" data-team-hierarchy-tree>
            <div class="text-muted">Загрузка иерархии…</div>
          </div>
        </div>
      </div>
    </aside>
    <section class="team-okrs-main" data-team-main-content>
      <div class="card">
        <div class="card-body">
          <div class="text-muted">Загрузка данных команды…</div>
        </div>
      </div>
    </section>
  </div>
</div>
{{end}}
