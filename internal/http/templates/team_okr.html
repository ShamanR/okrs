{{define "team-okr-content"}}
<nav class="mb-4" aria-label="breadcrumb">
  <ol class="breadcrumb" data-okr-breadcrumbs>
    <li class="breadcrumb-item"><a href="/teamOkrs">teamOkrs</a></li>
    <li class="breadcrumb-item active" aria-current="page">
      <a href="/teamOkrs?period_id={{.Period.ID}}&team={{.Team.ID}}">{{.Team.Name}} · {{.Period.Name}}</a>
    </li>
  </ol>
</nav>

<div id="team-okr-page" data-page="team-okr" data-team-id="{{.Team.ID}}" data-period-id="{{.Period.ID}}" data-period-name="{{.Period.Name}}">
  <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
    <h2 class="h4 mb-0">Цели</h2>
    <div data-okr-actions></div>
  </div>
  <div class="vstack gap-3" data-okr-goals>
    <div class="text-muted">Загрузка целей...</div>
  </div>
</div>
{{end}}
