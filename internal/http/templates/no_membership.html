{{define "no-membership"}}
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Нет доступа</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:#edf0f4;color:#111827;font-size:14px;padding:2rem;max-width:560px;margin:0 auto}
h1{font-size:20px;margin-bottom:.5rem}
p{color:#4b5563;margin-bottom:1rem}
form{display:flex;gap:8px;align-items:center;margin-top:1rem}
input{padding:6px 10px;border:1.5px solid #e5e7eb;border-radius:7px;flex:1}
button{padding:6px 14px;border:none;border-radius:7px;background:#2563eb;color:#fff;font-weight:600;cursor:pointer}
.msg{margin-top:.75rem}
.err{color:#b91c1c}
.ok{color:#047857}
</style>
</head>
<body>
<h1>Нет доступа</h1>
<p>У вашей учётной записи нет доступа ни к одной организации. Обратитесь к администратору
или запросите доступ по короткому имени (slug) организации.</p>

<form id="join-form">
  <input id="slug" placeholder="slug организации" required>
  <button type="submit">Запросить доступ</button>
</form>
<div class="msg" id="msg"></div>

<script>
const msg = document.getElementById('msg');
function show(text, ok){ msg.textContent = text; msg.className = 'msg ' + (ok ? 'ok' : 'err'); }

document.getElementById('join-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  show('', true);
  const slug = document.getElementById('slug').value.trim();
  const res = await fetch('/api/v1/onboarding/join-request', {
    method:'POST', headers:{'Content-Type':'application/json','Accept':'application/json'},
    body: JSON.stringify({slug})
  });
  if(res.status === 204){ show('Запрос отправлен. Дождитесь подтверждения администратора.', true); }
  else if(res.status === 404){ show('Организация с таким slug не найдена.', false); }
  else if(res.status === 409){ show('Вы уже состоите в этой организации.', false); }
  else { const b = await res.json().catch(()=>({})); show(b.error || ('Ошибка '+res.status), false); }
});
</script>
</body>
</html>
{{end}}
