{{define "admin-shell"}}
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OKR Admin · Управление</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/markdown.css">
<link rel="stylesheet" href="/static/header.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:#edf0f4;color:#111827;font-size:14px;-webkit-font-smoothing:antialiased}
a{color:#2563eb;text-decoration:none}
button{font-family:inherit}
input,select,textarea{font-family:inherit;font-size:14px}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#94a3b8}
@keyframes admModalIn{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)}}
.user-avatar__fallback{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:#7c3aed;color:white;font-weight:700;flex-shrink:0}
.user-selector{position:relative}
.user-selector__field{display:flex;align-items:center;flex-wrap:wrap;gap:4px;min-height:40px;padding:5px 10px;border:1.5px solid #e5e7eb;border-radius:9px;background:white;cursor:text}
.user-selector__field--open{border-color:#7c3aed;box-shadow:0 0 0 2px rgba(124,58,237,0.12)}
.user-selector__input{border:none;outline:none;font-size:14px;color:#111827;min-width:80px;flex:1;background:transparent;padding:2px 0}
.user-selector__input::placeholder{color:#9ca3af}
.user-selector__dropdown{position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:200;background:white;border:1px solid #e5e7eb;border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,0.1);max-height:220px;overflow-y:auto}
.user-selector__option{display:flex;align-items:center;gap:10px;padding:8px 12px;cursor:pointer}
.user-selector__option--hi{background:#f5f3ff}
.user-selector__option-info{display:flex;flex-direction:column;gap:1px;min-width:0}
.user-selector__option-name{font-size:13px;color:#111827;font-weight:500}
.user-selector__option-team{font-size:11px;color:#7c3aed}
.user-selector__empty{padding:12px;text-align:center;font-size:13px;color:#9ca3af}
.user-chip{display:inline-flex;align-items:center;gap:4px;background:#f5f3ff;border:1px solid rgba(124,58,237,0.25);border-radius:20px;padding:2px 8px 2px 4px;font-size:12px;flex-shrink:0}
.user-chip__name{color:#4c1d95;font-weight:500}
.user-chip__remove{background:none;border:none;cursor:pointer;color:#7c3aed;font-size:14px;padding:0;line-height:1;margin-left:1px}
</style>
</head>
<body>
<div id="root"><div style="height:100vh;display:flex;align-items:center;justify-content:center;color:#6b7280;font-size:14px">Загрузка…</div></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/marked@12.0.2/marked.min.js" integrity="sha384-/TQbtLCAerC3jgaim+N78RZSDYV7ryeoBCVqTuzRrFec2akfBkHS7ACQ3PQhvMVi" crossorigin="anonymous"></script>
<script src="https://unpkg.com/dompurify@3.1.7/dist/purify.min.js" integrity="sha384-XQqX/4yiUGu+oyr87jvWzRuqBUK/adrY0DunhL+tID9m/9dwSpV8h9Fk/Sg6ifVQ" crossorigin="anonymous"></script>
<script type="text/babel" src="/static/markdown.js" data-presets="react"></script>
<script type="text/babel" src="/static/header.js" data-presets="react"></script>
<script type="text/babel" src="/static/admin.js" data-presets="react"></script>
</body>
</html>
{{end}}
