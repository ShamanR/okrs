{{define "login"}}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>{{.PageTitle}} — OKR Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: radial-gradient(circle at top, #f5f7ff 0%, #f8f9fb 40%, #f2f4f8 100%); }
    .login-card { border-radius: 22px; box-shadow: 0 12px 30px rgba(30,41,59,0.12); }
    .btn-provider { border-radius: 999px; font-size: 1rem; padding: 0.65rem 1.5rem; }
  </style>
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">
  <div class="card login-card p-5" style="min-width: 340px; max-width: 420px; width: 100%;">
    <div class="text-center mb-4">
      <h4 class="fw-bold mb-1">OKR Tracker</h4>
      <p class="text-muted">Войдите, чтобы продолжить</p>
    </div>
    <div class="d-grid gap-3">
      {{range .Providers}}
        <a href="/auth/{{.Name}}/start{{if $.Next}}?next={{$.Next}}{{end}}"
           class="btn btn-outline-secondary btn-provider d-flex align-items-center justify-content-center gap-2">
          Войти через {{.DisplayName}}
        </a>
      {{else}}
        <div class="alert alert-warning">Ни один провайдер авторизации не настроен.</div>
      {{end}}
    </div>
  </div>
</body>
</html>
{{end}}
