function useStore(key,init){
  const [v,setV]=useState(()=>{try{const r=localStorage.getItem(key);return r?JSON.parse(r):init;}catch(e){return init;}});
  useEffect(()=>{try{localStorage.setItem(key,JSON.stringify(v));}catch(e){}},[key,v]);
  return [v,setV];
}
const userById=(users,id)=>users.find(u=>u.id===id);
const teamById=(teams,id)=>teams.find(t=>t.id===id);
const teamPath=(teams,id)=>{const out=[];let cur=teamById(teams,id);while(cur){out.unshift(cur);cur=cur.parentId?teamById(teams,cur.parentId):null;}return out;};
const teamPathLabel=(teams,id)=>teamPath(teams,id).map(t=>t.name).join(' › ');
function descendantIds(teams,rootId){
  const out=new Set([rootId]);let changed=true;
  while(changed){changed=false;for(const t of teams){if(t.parentId&&out.has(t.parentId)&&!out.has(t.id)){out.add(t.id);changed=true;}}}
  return out;
}
const depthOf=(teams,id)=>teamPath(teams,id).length-1;
function hierOrder(teams){
  const out=[];const byParent={};
  for(const t of teams){(byParent[t.parentId||'__root__']=byParent[t.parentId||'__root__']||[]).push(t);}
  function walk(parent){
    const kids=byParent[parent||'__root__']||[];
    kids.sort((a,b)=>(TEAM_TYPE_ORDER[a.type]-TEAM_TYPE_ORDER[b.type])||a.name.localeCompare(b.name));
    for(const k of kids){out.push(k);walk(k.id);}
  }
  walk(null);return out;
}

function Btn({variant='secondary',onClick,disabled,children,style={},danger,size='md',type='button'}){
  const pad=size==='sm'?'5px 12px':'8px 16px';

  if(variant==='primary'){bg=T.accent;color='white';border='1.5px solid '+T.accent;}
  else if(variant==='accent'){bg=T.link;color='white';border='1.5px solid '+T.link;}
  else if(variant==='ghost'){bg='transparent';border='1.5px solid transparent';}
  if(danger){color=T.danger;border='1.5px solid #fecaca';bg='white';}
  return <button type={type} onClick={onClick} disabled={disabled} style={{display:'inline-flex',alignItems:'center',justifyContent:'center',gap:6,padding:pad,borderRadius:20,border,background:bg,color,fontSize:fs,fontWeight:600,cursor:disabled?'not-allowed':'pointer',opacity:disabled?.5:1,transition:'all .12s',whiteSpace:'nowrap',...style}}>{children}</button>;
}

function HeaderUserMenu({user}){

    {icon:'⚙',label:'Управление',hint:'Команды, периоды, доступы',href:'OKR Admin.html',active:true},
    {icon:'✦',label:'Настройки',hint:'Уведомления, интеграции',href:'#'},

    <div style={{position:'relative'}} onMouseEnter={show} onMouseLeave={hide}>

// SECTION: PERIODS
// ═════════════════════════════════════════════════════════════════════════════
function PeriodsSection({periods,setPeriods,selectedId,setSelectedId}){
  const [q,setQ]=useState('');
  const [creating,setCreating]=useState(false);
  const sorted=[...periods].sort((a,b)=>a.order-b.order);
  const filtered=sorted.filter(p=>!q||p.label.toLowerCase().includes(q.toLowerCase()));
  const selected=creating?null:periods.find(p=>p.id===selectedId);

  function move(id,dir){
    const arr=[...periods].sort((a,b)=>a.order-b.order);
    const i=arr.findIndex(p=>p.id===id);const j=i+dir;
    if(j<0||j>=arr.length)return;
    [arr[i],arr[j]]=[arr[j],arr[i]];
    arr.forEach((p,idx)=>p.order=idx+1);
    setPeriods([...arr]);
  }
  function remove(id){
    if(!confirm('Удалить период? Цели внутри останутся, но не будут отображаться.'))return;
    setPeriods(periods.filter(p=>p.id!==id).map((p,i)=>({...p,order:i+1})));
    if(selectedId===id)setSelectedId(null);
  }
  function save(form){
    if(form.id&&periods.some(x=>x.id===form.id)){
      setPeriods(periods.map(x=>x.id===form.id?{...x,...form}:x));
      setSelectedId(form.id);
    } else {
      const id=form.label.toLowerCase().replace(/[^a-z0-9]+/g,'').slice(0,12)||`p${Date.now().toString(36)}`;
      const next={...form,id,order:periods.length+1};
      setPeriods([...periods,next]);
      setSelectedId(id);
    }
    setCreating(false);
  }

  return(
    <MasterDetail
      toolbar={<div style={{display:'flex',gap:8,alignItems:'center'}}>
        <ListSearch value={q} onChange={setQ} placeholder="Поиск периода…"/>
        <Btn variant="primary" size="sm" onClick={()=>{setCreating(true);setSelectedId(null);}}>+ Новый</Btn>
      </div>}
      listHeader={`Всего · ${sorted.length}`}
      list={filtered.map((p,i)=>{
        const sel=p.id===selectedId&&!creating;
        return <ListRow key={p.id} selected={sel} onClick={()=>{setSelectedId(p.id);setCreating(false);}}>
          <div style={{width:32,height:32,borderRadius:8,background:sel?'#ede9fe':'#f3f4f6',display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:700,color:sel?T.accent:T.mutedFg,flexShrink:0,letterSpacing:.3}}>{p.order}</div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:13.5,fontWeight:600,color:T.headingFg}}>{p.label}</div>
            <div style={{fontSize:11,color:T.mutedFg,fontFamily:'ui-monospace,Menlo,monospace',marginTop:2}}>{p.start} → {p.end}</div>
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:2}}>
            <button onClick={e=>{e.stopPropagation();move(p.id,-1);}} disabled={i===0} title="Выше"
              style={{width:22,height:18,borderRadius:4,border:'1px solid '+T.cardBorder,background:'white',color:T.mutedFg,cursor:i===0?'not-allowed':'pointer',opacity:i===0?.35:1,fontSize:9,padding:0,lineHeight:1}}>▲</button>
            <button onClick={e=>{e.stopPropagation();move(p.id,1);}} disabled={i===filtered.length-1} title="Ниже"
              style={{width:22,height:18,borderRadius:4,border:'1px solid '+T.cardBorder,background:'white',color:T.mutedFg,cursor:i===filtered.length-1?'not-allowed':'pointer',opacity:i===filtered.length-1?.35:1,fontSize:9,padding:0,lineHeight:1}}>▼</button>
          </div>
        </ListRow>;
      })}
      detail={
        creating ? <PeriodEditor value={{label:'',start:'',end:'',desc:''}} onSave={save} onCancel={()=>setCreating(false)}/>
        : selected ? <PeriodDetail period={selected} onSave={save} onDelete={()=>remove(selected.id)}/>
        : <EmptyDetail icon="📅" title="Выберите период" hint="Кликните по периоду в списке слева или создайте новый. Периоды определяют квартальные и годовые окна для OKR команд."/>
      }
    />
  );
}

// SECTION: TEAMS
// ═════════════════════════════════════════════════════════════════════════════
function TeamsSection({teams,setTeams,users,selectedId,setSelectedId}){
  const [q,setQ]=useState('');
  const [creating,setCreating]=useState(false);
  const ordered=useMemo(()=>hierOrder(teams),[teams]);
  const filteredIds=useMemo(()=>{
    if(!q)return new Set(ordered.map(t=>t.id));
    const ql=q.toLowerCase();
    const out=new Set();
    for(const t of ordered){
      if(t.name.toLowerCase().includes(ql))for(const n of teamPath(teams,t.id))out.add(n.id);
    }
    return out;
  },[q,ordered,teams]);
  const shown=ordered.filter(t=>filteredIds.has(t.id));
  const selected=creating?null:teams.find(t=>t.id===selectedId);

  function remove(id){
    const desc=descendantIds(teams,id);
    if(!confirm(`Удалить узел «${teamById(teams,id).name}»?\nВместе с ним будут удалены ${desc.size-1} вложенных.`))return;
    setTeams(teams.filter(t=>!desc.has(t.id)));
    if(selectedId===id)setSelectedId(null);
  }
  function save(form){
    if(form.id&&teams.some(t=>t.id===form.id)){
      setTeams(teams.map(t=>t.id===form.id?{...t,...form}:t));
      setSelectedId(form.id);
    } else {
      const id=`n${Date.now().toString(36)}`;
      setTeams([...teams,{...form,id}]);
      setSelectedId(id);
    }
    setCreating(false);
  }
  function move(id,dir){
    const cur=teamById(teams,id);const siblings=teams.filter(t=>t.parentId===cur.parentId);
    const myIdx=siblings.findIndex(s=>s.id===id);const target=Math.max(0,Math.min(siblings.length-1,myIdx+dir));
    if(target===myIdx)return;
    // rebuild teams keeping siblings' new order
    const others=teams.filter(t=>t.parentId!==cur.parentId);
    const newSibs=[...siblings];const [moved]=newSibs.splice(myIdx,1);newSibs.splice(target,0,moved);
    setTeams([...others,...newSibs]);
  }

  return(
    <MasterDetail
      toolbar={<div style={{display:'flex',gap:8,alignItems:'center'}}>
        <ListSearch value={q} onChange={setQ} placeholder="Поиск команды…"/>
        <Btn variant="primary" size="sm" onClick={()=>{setCreating(true);setSelectedId(null);}}>+ Новая</Btn>
      </div>}
      listHeader={`Иерархия · ${ordered.length}`}
      list={shown.map(t=>{
        const sel=t.id===selectedId&&!creating;
        const lead=t.leadId?userById(users,t.leadId):null;
        const depth=depthOf(teams,t.id);
        return <ListRow key={t.id} selected={sel} indent={depth*18} onClick={()=>{setSelectedId(t.id);setCreating(false);}}>
          <span style={{display:'inline-block',width:8,height:8,borderRadius:2,background:t.color,flexShrink:0}}/>
          <div style={{flex:1,minWidth:0}}>
            <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:2}}>
              <TypeBadge type={t.type}/>
              <span style={{fontSize:13.5,fontWeight:600,color:T.headingFg,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{t.name}</span>
            </div>
            {lead&&<div style={{display:'flex',alignItems:'center',gap:5,fontSize:11,color:T.mutedFg}}>
              <UserAvatar user={lead} size={15}/>
              <span style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{lead.name}</span>
            </div>}
          </div>
        </ListRow>;
      })}
      listWidth={480}
      detail={
        creating ? <TeamEditor value={{name:'',type:'team',parentId:null,leadId:null,color:'#2563eb',desc:''}} teams={teams} users={users} onSave={save} onCancel={()=>setCreating(false)}/>
        : selected ? <TeamDetail team={selected} teams={teams} users={users} onSave={save} onDelete={()=>remove(selected.id)} onMove={move}/>
        : <EmptyDetail icon="👥" title="Выберите команду" hint="Кликните по узлу в списке слева или создайте новую команду. Можно переключать иерархию, менять руководителя и цвет."/>
      }
    />
  );
}

        {lead&&<div style={{marginTop:10,padding:'10px 12px',background:'#f8fafc',borderRadius:9,display:'flex',alignItems:'center',gap:10}}>
          <UserAvatar user={lead} size={32}/>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:13,fontWeight:600,color:T.headingFg}}>{lead.name}</div>
            <div style={{fontSize:11,color:T.mutedFg}}>{lead.role} · {lead.email}</div>
          </div>
        </div>}
      </DetailSection>

      <DetailSection title="Визуальная метка">
        <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
          {TEAM_COLORS.map(c=>{
            const sel=f.color===c;
            return <button key={c} onClick={()=>setF({...f,color:c})} style={{width:32,height:32,borderRadius:'50%',background:c,border:sel?'3px solid '+T.headingFg:'2px solid white',boxShadow:'0 1px 3px rgba(0,0,0,0.15)',cursor:'pointer',padding:0}}/>;
          })}
        </div>
      </DetailSection>

      <DetailSection title="Расположение в иерархии">
        <Field label="Родительская команда" hint="перемещает узел вместе с вложенными">
          <select value={f.parentId||''} onChange={e=>setF({...f,parentId:e.target.value||null})} style={{...inp,cursor:'pointer'}}>
            <option value="">Без родителя (корневой кластер)</option>
            {parentOptions.map(t=><option key={t.id} value={t.id}>{TEAM_TYPE_LABEL[t.type]} · {teamPathLabel(teams,t.id)}</option>)}
          </select>
        </Field>
        {!isNew&&children.length>0&&<div style={{fontSize:12,color:T.mutedFg,marginTop:4}}>
          Внутри: {children.map(c=>c.name).join(', ')}
        </div>}
      </DetailSection>
    </div>
  );
}

function LeadPicker({value,users,onChange}){
  const [open,setOpen]=useState(false);
  const [q,setQ]=useState('');
  const ref=useRef();
  useEffect(()=>{
    const h=e=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false);};
    document.addEventListener('mousedown',h);return()=>document.removeEventListener('mousedown',h);
  },[]);
  const sel=value?users.find(u=>u.id===value):null;
  const filtered=users.filter(u=>u.name.toLowerCase().includes(q.toLowerCase())||u.email.toLowerCase().includes(q.toLowerCase()));
  return(
    <div ref={ref} style={{position:'relative'}}>
      <div onClick={()=>setOpen(o=>!o)} style={{...inp,cursor:'pointer',display:'flex',alignItems:'center',gap:8,minHeight:42}}>
        {sel?(
          <span style={{display:'inline-flex',alignItems:'center',gap:7,padding:'3px 10px 3px 3px',background:'#f1f5f9',borderRadius:20}}>
            <UserAvatar user={sel} size={22}/>
            <span style={{fontSize:13,color:T.headingFg}}>{sel.name}</span>
            <span onClick={e=>{e.stopPropagation();onChange(null);}} style={{color:T.dimFg,cursor:'pointer',fontSize:14,padding:'0 4px'}}>×</span>
          </span>
        ):(<span style={{color:T.dimFg,fontSize:13}}>— не выбран —</span>)}
        <span style={{flex:1}}/>
        <span style={{color:T.dimFg,fontSize:11}}>▾</span>
      </div>
      {open&&(
        <div style={{position:'absolute',top:'calc(100% + 4px)',left:0,right:0,background:'white',border:'1px solid '+T.cardBorder,borderRadius:10,boxShadow:'0 10px 30px rgba(0,0,0,0.12)',zIndex:10,maxHeight:280,overflow:'hidden',display:'flex',flexDirection:'column'}}>
          <input autoFocus value={q} onChange={e=>setQ(e.target.value)} placeholder="Поиск по имени / email…" style={{border:'none',borderBottom:'1px solid '+T.hairline,padding:'10px 14px',outline:'none',fontSize:13}}/>
          <div style={{overflow:'auto',flex:1}}>
            {filtered.map(u=>(
              <div key={u.id} onClick={()=>{onChange(u.id);setOpen(false);setQ('');}} style={{padding:'8px 14px',display:'flex',alignItems:'center',gap:10,cursor:'pointer',background:u.id===value?'#eff6ff':'transparent'}}
                onMouseEnter={e=>{if(u.id!==value)e.currentTarget.style.background='#f8fafc';}}
                onMouseLeave={e=>{if(u.id!==value)e.currentTarget.style.background='transparent';}}>
                <UserAvatar user={u} size={26}/>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:13,color:T.headingFg,fontWeight:500,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{u.name}</div>
                  <div style={{fontSize:11,color:T.mutedFg,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{u.role} · {u.email}</div>
                </div>
              </div>
            ))}
            {filtered.length===0&&<div style={{padding:14,textAlign:'center',color:T.dimFg,fontSize:12}}>Ничего не найдено</div>}
          </div>
        </div>
      )}
    </div>
  );
}

// ═════════════════════════════════════════════════════════════════════════════
// TEAM COMBOBOX — hierarchical, with suggest (shared vocabulary w/ main app)
// ═════════════════════════════════════════════════════════════════════════════
function TeamCombobox({selectedIds,onChange,teams,placeholder,accent=T.accent,autoReplaceDescendants=true}){
  const [q,setQ]=useState('');
  const [open,setOpen]=useState(false);
  const [hi,setHi]=useState(0);
  const inputRef=useRef();
  const wrapRef=useRef();
  const selected=selectedIds.map(id=>teamById(teams,id)).filter(Boolean);
  const ql=q.trim().toLowerCase();
  const tree=useMemo(()=>{
    const ordered=hierOrder(teams);
    return ordered.map(t=>({...t,depth:depthOf(teams,t.id)}));
  },[teams]);
  // When searching: keep matches + all their ancestors as context (non-selectable)
  const selectable=new Set();
  const visible=new Set();
  tree.forEach(t=>{
    const matches=!ql||t.name.toLowerCase().includes(ql)||(TEAM_TYPE_LABEL[t.type]||'').toLowerCase().includes(ql);
    if(matches){
      selectable.add(t.id);
      let p=t.parentId;
      while(p){visible.add(p);p=teamById(teams,p)?.parentId;}
      visible.add(t.id);
    }
  });
  if(!ql)tree.forEach(t=>{selectable.add(t.id);visible.add(t.id);});
  const list=tree.filter(t=>visible.has(t.id)).map(t=>{
    const isSelected=selectedIds.includes(t.id);
    // also check if covered by a parent already in scope
    const coveredByParent=!isSelected&&selectedIds.some(sid=>sid!==t.id&&descendantIds(teams,sid).has(t.id));
    return {...t,isSelected,coveredByParent,isSelectable:selectable.has(t.id)&&!isSelected&&!coveredByParent};
  });
  const interactable=list.filter(x=>x.isSelectable);
  useEffect(()=>{setHi(0);},[q,open]);
  useEffect(()=>{
    const h=(e)=>{if(wrapRef.current&&!wrapRef.current.contains(e.target))setOpen(false);};
    document.addEventListener('mousedown',h);
    return()=>document.removeEventListener('mousedown',h);
  },[]);
  const add=(t)=>{
    let next=[...selectedIds,t.id];
    if(autoReplaceDescendants){
      // remove descendants of the newly added node — parent now covers them
      const newDesc=descendantIds(teams,t.id);
      next=next.filter(id=>id===t.id||!newDesc.has(id));
    }
    onChange(next);setQ('');inputRef.current?.focus();
  };
  const remove=(id)=>onChange(selectedIds.filter(x=>x!==id));
  const onKey=(e)=>{
    if(e.key==='ArrowDown'){e.preventDefault();setOpen(true);setHi(h=>Math.min(interactable.length-1,h+1));}
    else if(e.key==='ArrowUp'){e.preventDefault();setHi(h=>Math.max(0,h-1));}
    else if(e.key==='Enter'){e.preventDefault();if(open&&interactable[hi])add(interactable[hi]);}
    else if(e.key==='Escape'){setOpen(false);}
    else if(e.key==='Backspace'&&!q&&selected.length>0){remove(selected[selected.length-1].id);}
  };
  const highlight=(text)=>{
    if(!ql)return text;
    const i=text.toLowerCase().indexOf(ql);
    if(i<0)return text;
    return(<>{text.slice(0,i)}<mark style={{background:`${accent}30`,color:'inherit',padding:0}}>{text.slice(i,i+ql.length)}</mark>{text.slice(i+ql.length)}</>);
  };
  return(
    <div ref={wrapRef} style={{position:'relative'}}>
      <div onClick={()=>{setOpen(true);inputRef.current?.focus();}}
        style={{minHeight:42,padding:'5px 7px',border:`1.5px solid ${open?accent:T.cardBorder}`,borderRadius:9,background:'white',display:'flex',flexWrap:'wrap',gap:5,alignItems:'center',cursor:'text',transition:'border-color .12s'}}>
        {selected.map(t=>{
          const color=TEAM_TYPE_COLOR[t.type]||T.mutedFg;
          return(
            <div key={t.id} style={{display:'inline-flex',alignItems:'center',gap:6,padding:'3px 4px 3px 8px',borderRadius:16,background:`${color}15`,border:`1px solid ${color}40`}}>
              <span style={{fontSize:9,fontWeight:700,color:color,textTransform:'uppercase',letterSpacing:.4}}>{TEAM_TYPE_LABEL[t.type]}</span>
              <span style={{fontSize:12,fontWeight:600,color:T.bodyFg}}>{t.name}</span>
              <button onClick={(e)=>{e.stopPropagation();remove(t.id);}}
                style={{background:'none',border:'none',cursor:'pointer',color:T.mutedFg,fontSize:14,lineHeight:1,padding:'0 4px',borderRadius:8}}
                onMouseEnter={e=>e.currentTarget.style.color=T.danger}
                onMouseLeave={e=>e.currentTarget.style.color=T.mutedFg}>×</button>
            </div>
          );
        })}
        <input ref={inputRef} value={q} onChange={e=>{setQ(e.target.value);setOpen(true);}}
          onFocus={()=>setOpen(true)} onKeyDown={onKey}
          placeholder={selected.length?'Ещё команду…':(placeholder||'Начните вводить название команды')}
          style={{flex:1,minWidth:180,border:'none',outline:'none',fontSize:13,padding:'6px 4px',background:'transparent',fontFamily:'inherit',color:T.bodyFg}}/>
      </div>
      {open&&(
        <div style={{position:'absolute',top:'calc(100% + 4px)',left:0,right:0,background:'white',borderRadius:9,boxShadow:'0 10px 30px rgba(0,0,0,0.15)',border:'1px solid '+T.cardBorder,maxHeight:320,overflow:'auto',zIndex:50}}>
          {list.length===0?(
            <div style={{padding:'14px 16px',fontSize:12,color:T.dimFg,textAlign:'center'}}>
              {ql?`Команды не найдены по запросу «${q}»`:'Все команды уже добавлены'}
            </div>
          ):(
            <>
              {(()=>{
                let hiIdx=0;
                return list.map((t)=>{
                  const color=TEAM_TYPE_COLOR[t.type]||T.mutedFg;
                  const isHi=t.isSelectable&&hiIdx===hi;
                  const myIdx=t.isSelectable?hiIdx:-1;
                  if(t.isSelectable)hiIdx++;
                  return(
                    <div key={t.id}
                      onClick={t.isSelectable?()=>add(t):undefined}
                      onMouseEnter={t.isSelectable?()=>setHi(myIdx):undefined}
                      style={{
                        padding:'6px 12px 6px 8px',
                        display:'flex',alignItems:'center',gap:6,
                        cursor:t.isSelectable?'pointer':'default',
                        background:isHi?'#f3f4f6':'white',
                        opacity:t.isSelectable?1:0.55,
                        borderLeft:`3px solid ${isHi?color:'transparent'}`,
                      }}>
                      <div style={{display:'flex',flexShrink:0,alignSelf:'stretch'}}>
                        {Array.from({length:t.depth}).map((_,d)=>(
                          <div key={d} style={{width:14,borderRight:'1px dashed #e5e7eb',marginRight:0}}/>
                        ))}
                      </div>
                      <div style={{width:3,height:22,borderRadius:2,background:color,flexShrink:0}}/>
                      <span style={{fontSize:9,fontWeight:700,color:color,textTransform:'uppercase',letterSpacing:.4,padding:'2px 5px',background:`${color}12`,borderRadius:3,flexShrink:0}}>{TEAM_TYPE_LABEL[t.type]}</span>
                      <span style={{fontSize:13,fontWeight:t.isSelectable?500:400,color:t.isSelectable?T.bodyFg:T.dimFg,flex:1,minWidth:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                        {highlight(t.name)}
                      </span>
                      {t.isSelected&&<span style={{fontSize:10,color:T.success,fontWeight:600,flexShrink:0}}>✓ выбрана</span>}
                      {t.coveredByParent&&<span style={{fontSize:10,color:T.info,fontWeight:600,flexShrink:0}} title="Уже покрыта родительским доступом">покрыта родителем</span>}
                      {!t.isSelected&&!t.coveredByParent&&!t.isSelectable&&<span style={{fontSize:10,color:T.dimFg,flexShrink:0}}>группа</span>}
                    </div>
                  );
                });
              })()}
              <div style={{padding:'6px 12px',fontSize:10,color:T.dimFg,borderTop:'1px solid '+T.hairline,background:'#fafbfc',display:'flex',justifyContent:'space-between',position:'sticky',bottom:0}}>
                <span>↑↓ навигация · Enter — выбрать · Backspace — убрать</span>
                <span>{interactable.length} доступно</span>
              </div>
            </>
          )}
        </div>
      )}
    </div>
  );
}

// ═════════════════════════════════════════════════════════════════════════════
// SECTION: USERS
// ═════════════════════════════════════════════════════════════════════════════
function UsersSection({users,setUsers,teams,selectedId,setSelectedId,currentUserId,onGoToTeam}){
  const [q,setQ]=useState('');
  const filtered=users.filter(u=>!q||u.name.toLowerCase().includes(q.toLowerCase())||u.email.toLowerCase().includes(q.toLowerCase())||u.role.toLowerCase().includes(q.toLowerCase()));
  const selected=users.find(u=>u.id===selectedId);
  const adminCount=users.filter(u=>u.isAdmin).length;

  function update(id,patch){setUsers(users.map(u=>u.id===id?{...u,...patch}:u));}
  function toggleAdmin(u){
    if(u.isAdmin&&adminCount<=1){alert('Нельзя снять admin-права с последнего администратора.');return;}
    if(u.isAdmin&&u.id===currentUserId&&!confirm('Снять admin-права с себя? Вы потеряете доступ к этому разделу.'))return;
    update(u.id,{isAdmin:!u.isAdmin});
  }

  return(
    <MasterDetail
      toolbar={<ListSearch value={q} onChange={setQ} placeholder="Поиск по имени, роли, email…"/>}
      listHeader={`Все пользователи · ${users.length} · админов ${adminCount}`}
      list={filtered.map(u=>{
        const sel=u.id===selectedId;
        return <ListRow key={u.id} selected={sel} onClick={()=>setSelectedId(u.id)}>
          <UserAvatar user={u} size={32}/>
          <div style={{flex:1,minWidth:0}}>
            <div style={{display:'flex',alignItems:'center',gap:6}}>
              <span style={{fontSize:13.5,fontWeight:600,color:T.headingFg,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{u.name}</span>
              {u.id===currentUserId&&<span style={{fontSize:9.5,color:T.mutedFg,background:'#f1f5f9',padding:'1px 6px',borderRadius:4,fontWeight:700,letterSpacing:.3}}>ВЫ</span>}
            </div>
            <div style={{fontSize:11,color:T.mutedFg,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',marginTop:2}}>{u.role} · {u.dept}</div>
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:3,alignItems:'flex-end',flexShrink:0}}>
            {u.isAdmin&&<Chip color="#92400e" bg="#fef3c7">Admin</Chip>}
            <span style={{fontSize:10.5,color:u.scopes.length===0?T.success:T.info,fontWeight:600}}>
              {u.scopes.length===0?'весь доступ':`${u.scopes.length} узл${u.scopes.length===1?'':u.scopes.length<5?'а':'ов'}`}
            </span>
          </div>
        </ListRow>;
      })}
      detail={
        selected ? <UserDetail user={selected} users={users} teams={teams} currentUserId={currentUserId}
                              onToggleAdmin={()=>toggleAdmin(selected)}
                              onUpdate={patch=>update(selected.id,patch)}
                              onGoToTeam={onGoToTeam}/>
        : <EmptyDetail icon="🔑" title="Выберите пользователя" hint="В списке слева — все пользователи OKR Tracker. Здесь можно выдавать admin-права и управлять доступом к конкретным узлам иерархии."/>
      }
    />
  );
}

function UserDetail({user,users,teams,currentUserId,onToggleAdmin,onUpdate,onGoToTeam}){
  const isSelf=user.id===currentUserId;
  const leadOf=teams.filter(t=>t.leadId===user.id);

  function updateScopes(newScopes){onUpdate({scopes:newScopes});}

  return(
    <div>
      <DetailHeader
        breadcrumb="Пользователи · карточка"
        title={<span style={{display:'inline-flex',alignItems:'center',gap:12}}>
          <UserAvatar user={user} size={36}/>
          {user.name}
          {isSelf&&<span style={{fontSize:10.5,color:T.mutedFg,background:'#f1f5f9',padding:'2px 7px',borderRadius:5,fontWeight:700,letterSpacing:.3}}>ВЫ</span>}
          {user.isAdmin&&<Chip color="#92400e" bg="#fef3c7">Admin</Chip>}
        </span>}
        subtitle={<span>
          <ProviderChip p={user.provider}/> · {user.email} · {user.role} · {user.dept}
        </span>}
        actions={<Btn variant={user.isAdmin?'secondary':'accent'} danger={user.isAdmin} onClick={onToggleAdmin}>
          {user.isAdmin?'Снять admin':'Назначить admin'}
        </Btn>}
      />

      <DetailSection title="Учётная запись">
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
          <Field label="Email"><input value={user.email} readOnly style={{...inp,background:'#f8fafc',color:T.mutedFg}}/></Field>
          <Field label="Последний вход"><input value={user.lastLogin} readOnly style={{...inp,background:'#f8fafc',color:T.mutedFg,fontFamily:'ui-monospace,Menlo,monospace',fontSize:13}}/></Field>
          <Field label="Провайдер"><input value={user.provider} readOnly style={{...inp,background:'#f8fafc',color:T.mutedFg,fontFamily:'ui-monospace,Menlo,monospace',fontSize:13}}/></Field>
          <Field label="Отдел"><input value={user.dept} readOnly style={{...inp,background:'#f8fafc',color:T.mutedFg}}/></Field>
        </div>
      </DetailSection>

      <DetailSection title={`Является руководителем · ${leadOf.length}`}>
        {leadOf.length===0?(
          <div style={{fontSize:12.5,color:T.mutedFg,fontStyle:'italic'}}>Пользователь не назначен руководителем ни в одной команде.</div>
        ):(
          <div style={{display:'flex',flexDirection:'column',gap:6}}>
            {leadOf.map(t=>(
              <button key={t.id} onClick={()=>onGoToTeam&&onGoToTeam(t.id)}
                style={{display:'flex',alignItems:'center',gap:10,padding:'8px 12px',background:'white',border:'1px solid '+T.cardBorder,borderRadius:9,cursor:'pointer',textAlign:'left',fontFamily:'inherit',transition:'all .12s'}}
                onMouseEnter={e=>{e.currentTarget.style.background='#f8fafc';e.currentTarget.style.borderColor='#c4b5fd';}}
                onMouseLeave={e=>{e.currentTarget.style.background='white';e.currentTarget.style.borderColor=T.cardBorder;}}>
                <span style={{display:'inline-block',width:8,height:8,borderRadius:2,background:t.color,flexShrink:0}}/>
                <TypeBadge type={t.type}/>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:13,fontWeight:600,color:T.headingFg}}>{t.name}</div>
                  <div style={{fontSize:11,color:T.mutedFg,marginTop:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{teamPathLabel(teams,t.id)}</div>
                </div>
                <span style={{fontSize:11,color:T.accent,fontWeight:600,flexShrink:0}}>Открыть →</span>
              </button>
            ))}
          </div>
        )}
      </DetailSection>

      <DetailSection title="Доступ к иерархии">
        <div style={{fontSize:12.5,color:T.mutedFg,marginBottom:12,lineHeight:1.5}}>
          Список конкретных команд, к которым пользователь имеет доступ. При выборе узла он видит только его и все дочерние.
          Если список пуст — виден весь tree.
        </div>

        {user.scopes.length===0&&(
          <div style={{padding:'12px 14px',background:'#ecfdf5',border:'1px solid #a7f3d0',borderRadius:9,color:'#065f46',fontSize:13,fontWeight:600,display:'flex',alignItems:'center',gap:8,marginBottom:12}}>
            <span style={{width:8,height:8,background:'#10b981',borderRadius:'50%'}}/>
            Полный доступ — видна вся иерархия
          </div>
        )}

        <Field label="Команды, к которым есть доступ" hint="выбор с поиском и иерархией">
          <TeamCombobox selectedIds={user.scopes} onChange={updateScopes} teams={teams}
            placeholder="Выберите команды из иерархии…"/>
        </Field>

        {user.scopes.length>0&&(
          <div style={{marginTop:8,fontSize:11.5,color:T.mutedFg,lineHeight:1.5}}>
            При выборе родительской команды — доступ к всем дочерним выдаётся автоматически. Дочерние узлы ниже уже выбранной родительской не отображаются.
          </div>
        )}
      </DetailSection>
    </div>
  );
}

// APP
// ═════════════════════════════════════════════════════════════════════════════
function App(){
  const [section,setSection]=useStore('okr_admin_section','periods');
  const [periods,setPeriods]=useStore('okr_periods',PERIODS_SEED);
  const [teams,setTeams]=useStore('okr_teams',TEAMS_SEED);
  const [users,setUsers]=useStore('okr_users',USERS_SEED);
  const [selPeriod,setSelPeriod]=useStore('okr_admin_sel_period','y26q1');
  const [selTeam,setSelTeam]=useStore('okr_admin_sel_team','t1');
  const [selUser,setSelUser]=useStore('okr_admin_sel_user','u2');

  const currentUserId='u2';
  const currentUser=users.find(u=>u.id===currentUserId)||users[0];

  return(
    <Shell section={section} setSection={setSection} currentUser={currentUser}>
      {section==='periods'&&<PeriodsSection periods={periods} setPeriods={setPeriods} selectedId={selPeriod} setSelectedId={setSelPeriod}/>}
      {section==='teams'&&<TeamsSection teams={teams} setTeams={setTeams} users={users} selectedId={selTeam} setSelectedId={setSelTeam}/>}
      {section==='users'&&<UsersSection users={users} setUsers={setUsers} teams={teams} selectedId={selUser} setSelectedId={setSelUser} currentUserId={currentUserId} onGoToTeam={tid=>{setSelTeam(tid);setSection('teams');}}/>}
    </Shell>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
