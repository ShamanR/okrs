function calcKRProgress(kr){
  if(kr.krType==='BOOLEAN') return kr.done?100:0;
  if(kr.krType==='PROJECT') return Math.min(100,(kr.stages||[]).filter(s=>s.done).reduce((a,s)=>a+s.weight,0));

function goalProgress(g){
  if(!g.krs.length)return 0;
  const tw=g.krs.reduce((s,k)=>s+k.weight,0);
  return tw?Math.round(g.krs.reduce((s,k)=>s+calcKRProgress(k)*k.weight/100,0)*100/tw):0;
}
function teamProgress(id,pid,goals){
  const gs=goals[`${id}_${pid}`]||[];
  if(!gs.length)return null;
  const tw=gs.reduce((s,g)=>s+g.weight,0);
  return tw?Math.round(gs.reduce((s,g)=>s+goalProgress(g)*g.weight/100,0)*100/tw):0;
}

// ── OWNER COMBOBOX (search + suggest for potentially large user lists) ────────
function OwnerCombobox({selectedIds,onChange,users,accent}){
  const [q,setQ]=useState('');
  const [open,setOpen]=useState(false);
  const [hi,setHi]=useState(0);
  const inputRef=useRef();
  const wrapRef=useRef();
  const selected=selectedIds.map(id=>users.find(u=>u.id===id)).filter(Boolean);
  const ql=q.trim().toLowerCase();
  const available=users.filter(u=>!selectedIds.includes(u.id));
  const filtered=ql?available.filter(u=>u.name.toLowerCase().includes(ql)||(u.role||'').toLowerCase().includes(ql)||(u.dept||'').toLowerCase().includes(ql)):available;
  useEffect(()=>{setHi(0);},[q,open]);
  useEffect(()=>{
    const h=(e)=>{if(wrapRef.current&&!wrapRef.current.contains(e.target))setOpen(false);};
    document.addEventListener('mousedown',h);
    return()=>document.removeEventListener('mousedown',h);
  },[]);
  const add=(u)=>{onChange([...selectedIds,u.id]);setQ('');inputRef.current?.focus();};
  const remove=(id)=>onChange(selectedIds.filter(x=>x!==id));
  const onKey=(e)=>{
    if(e.key==='ArrowDown'){e.preventDefault();setOpen(true);setHi(h=>Math.min(filtered.length-1,h+1));}
    else if(e.key==='ArrowUp'){e.preventDefault();setHi(h=>Math.max(0,h-1));}
    else if(e.key==='Enter'){e.preventDefault();if(open&&filtered[hi])add(filtered[hi]);}
    else if(e.key==='Escape'){setOpen(false);}
    else if(e.key==='Backspace'&&!q&&selected.length>0){remove(selected[selected.length-1].id);}
  };
  const highlight=(text)=>{
    if(!ql)return text;
    const i=text.toLowerCase().indexOf(ql);
    if(i<0)return text;
    return(<>{text.slice(0,i)}<mark style={{background:`${accent}30`,color:'inherit',padding:0}}>{text.slice(i,i+ql.length)}</mark>{text.slice(i+ql.length)}</>);
  };
  return(
    <div ref={wrapRef} style={{position:'relative'}}>
      <div onClick={()=>{setOpen(true);inputRef.current?.focus();}}
        style={{minHeight:42,padding:'5px 7px',border:`1px solid ${open?accent:'#e5e7eb'}`,borderRadius:9,background:'white',display:'flex',flexWrap:'wrap',gap:5,alignItems:'center',cursor:'text',transition:'border-color .12s'}}>
        {selected.map(u=>(
          <div key={u.id} style={{display:'inline-flex',alignItems:'center',gap:6,padding:'3px 4px 3px 3px',borderRadius:16,background:`${u.color}18`,border:`1px solid ${u.color}40`}}>
            <div style={{width:20,height:20,borderRadius:'50%',background:u.color,display:'flex',alignItems:'center',justifyContent:'center',fontSize:9,fontWeight:700,color:'white'}}>{u.initials}</div>
            <span style={{fontSize:12,fontWeight:500,color:'#111827'}}>{u.name}</span>
            <button onClick={(e)=>{e.stopPropagation();remove(u.id);}}
              style={{background:'none',border:'none',cursor:'pointer',color:'#6b7280',fontSize:14,lineHeight:1,padding:'0 4px',borderRadius:8}}
              onMouseEnter={e=>e.currentTarget.style.color='#dc2626'}
              onMouseLeave={e=>e.currentTarget.style.color='#6b7280'}>×</button>
          </div>
        ))}
        <input ref={inputRef} value={q} onChange={e=>{setQ(e.target.value);setOpen(true);}}
          onFocus={()=>setOpen(true)} onKeyDown={onKey}
          placeholder={selected.length?'Добавить ещё…':'Начните вводить имя, роль или отдел'}
          style={{flex:1,minWidth:160,border:'none',outline:'none',fontSize:13,padding:'6px 4px',background:'transparent',fontFamily:'inherit',color:'#111827'}}/>
      </div>
      {open&&(
        <div style={{position:'absolute',top:'calc(100% + 4px)',left:0,right:0,background:'white',borderRadius:9,boxShadow:'0 10px 30px rgba(0,0,0,0.15)',border:'1px solid #e5e7eb',maxHeight:280,overflow:'auto',zIndex:50}}>
          {filtered.length===0?(
            <div style={{padding:'14px 16px',fontSize:12,color:'#9ca3af',textAlign:'center'}}>
              {ql?`Никого не найдено по запросу «${q}»`:'Все пользователи уже выбраны'}
            </div>
          ):filtered.map((u,i)=>(
            <div key={u.id} onClick={()=>add(u)} onMouseEnter={()=>setHi(i)}
              style={{padding:'7px 12px',display:'flex',alignItems:'center',gap:10,cursor:'pointer',background:i===hi?'#f3f4f6':'white'}}>
              <div style={{width:26,height:26,borderRadius:'50%',background:u.color,display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,fontWeight:700,color:'white',flexShrink:0}}>{u.initials}</div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:13,fontWeight:500,color:'#111827',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{highlight(u.name)}</div>
                <div style={{fontSize:11,color:'#6b7280',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{highlight(u.role||'')}{u.dept?' · ':''}{highlight(u.dept||'')}</div>
              </div>
              <span style={{fontSize:11,color:'#9ca3af',flexShrink:0}}>Enter ↵</span>
            </div>
          ))}
          {filtered.length>0&&(
            <div style={{padding:'6px 12px',fontSize:10,color:'#9ca3af',borderTop:'1px solid #f3f4f6',background:'#fafbfc',display:'flex',justifyContent:'space-between'}}>
              <span>↑↓ навигация · Enter — выбрать · Backspace — убрать</span>
              <span>{filtered.length} из {users.length}</span>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ── TEAM COMBOBOX (search teams for sharing a goal) ───────────────────────────
function TeamCombobox({selectedIds,onChange,excludeTeamId,accent}){
  const [q,setQ]=useState('');
  const [open,setOpen]=useState(false);
  const [hi,setHi]=useState(0);
  const inputRef=useRef();
  const wrapRef=useRef();
  const selected=selectedIds.map(id=>teamById(id)).filter(Boolean);
  const ql=q.trim().toLowerCase();
  // Build hierarchical list in pre-order with depth
  const tree=flattenTeams().filter(t=>t.id!==excludeTeamId);
  // When searching: keep matches + all their ancestors as context (non-selectable)
  const selectable=new Set();
  const visible=new Set();
  tree.forEach(t=>{
    const matches=!ql||t.name.toLowerCase().includes(ql)||(TEAM_TYPE_LABEL[t.type]||'').toLowerCase().includes(ql);
    if(matches){
      selectable.add(t.id);
      // add ancestors for context
      let p=t.parentId;
      while(p){visible.add(p);p=teamById(p)?.parentId;}
    }
    if(matches)visible.add(t.id);
  });
  if(!ql)tree.forEach(t=>{selectable.add(t.id);visible.add(t.id);});
  const list=tree.filter(t=>visible.has(t.id)).map(t=>({
    ...t,
    isSelected:selectedIds.includes(t.id),
    isSelectable:selectable.has(t.id)&&!selectedIds.includes(t.id),
  }));
  const interactable=list.filter(x=>x.isSelectable);
  useEffect(()=>{setHi(0);},[q,open]);
  useEffect(()=>{
    const h=(e)=>{if(wrapRef.current&&!wrapRef.current.contains(e.target))setOpen(false);};
    document.addEventListener('mousedown',h);
    return()=>document.removeEventListener('mousedown',h);
  },[]);
  const add=(t)=>{onChange([...selectedIds,t.id]);setQ('');inputRef.current?.focus();};
  const remove=(id)=>onChange(selectedIds.filter(x=>x!==id));
  const onKey=(e)=>{
    if(e.key==='ArrowDown'){e.preventDefault();setOpen(true);setHi(h=>Math.min(interactable.length-1,h+1));}
    else if(e.key==='ArrowUp'){e.preventDefault();setHi(h=>Math.max(0,h-1));}
    else if(e.key==='Enter'){e.preventDefault();if(open&&interactable[hi])add(interactable[hi]);}
    else if(e.key==='Escape'){setOpen(false);}
    else if(e.key==='Backspace'&&!q&&selected.length>0){remove(selected[selected.length-1].id);}
  };
  const highlight=(text)=>{
    if(!ql)return text;
    const i=text.toLowerCase().indexOf(ql);
    if(i<0)return text;
    return(<>{text.slice(0,i)}<mark style={{background:`${accent}30`,color:'inherit',padding:0}}>{text.slice(i,i+ql.length)}</mark>{text.slice(i+ql.length)}</>);
  };
  return(
    <div ref={wrapRef} style={{position:'relative'}}>
      <div onClick={()=>{setOpen(true);inputRef.current?.focus();}}
        style={{minHeight:42,padding:'5px 7px',border:`1px solid ${open?accent:'#e5e7eb'}`,borderRadius:9,background:'white',display:'flex',flexWrap:'wrap',gap:5,alignItems:'center',cursor:'text',transition:'border-color .12s'}}>
        {selected.map(t=>{
          const color=TEAM_TYPE_COLOR[t.type]||'#6b7280';
          return(
            <div key={t.id} style={{display:'inline-flex',alignItems:'center',gap:6,padding:'3px 4px 3px 8px',borderRadius:16,background:`${color}15`,border:`1px solid ${color}40`}}>
              <span style={{fontSize:9,fontWeight:700,color:color,textTransform:'uppercase',letterSpacing:.4}}>{TEAM_TYPE_LABEL[t.type]}</span>
              <span style={{fontSize:12,fontWeight:600,color:'#111827'}}>{t.name}</span>
              <button onClick={(e)=>{e.stopPropagation();remove(t.id);}}
                style={{background:'none',border:'none',cursor:'pointer',color:'#6b7280',fontSize:14,lineHeight:1,padding:'0 4px',borderRadius:8}}
                onMouseEnter={e=>e.currentTarget.style.color='#dc2626'}
                onMouseLeave={e=>e.currentTarget.style.color='#6b7280'}>×</button>
            </div>
          );
        })}
        <input ref={inputRef} value={q} onChange={e=>{setQ(e.target.value);setOpen(true);}}
          onFocus={()=>setOpen(true)} onKeyDown={onKey}
          placeholder={selected.length?'Ещё команду…':'Начните вводить название команды'}
          style={{flex:1,minWidth:180,border:'none',outline:'none',fontSize:13,padding:'6px 4px',background:'transparent',fontFamily:'inherit',color:'#111827'}}/>
      </div>
      {open&&(
        <div style={{position:'absolute',top:'calc(100% + 4px)',left:0,right:0,background:'white',borderRadius:9,boxShadow:'0 10px 30px rgba(0,0,0,0.15)',border:'1px solid #e5e7eb',maxHeight:320,overflow:'auto',zIndex:50}}>
          {list.length===0?(
            <div style={{padding:'14px 16px',fontSize:12,color:'#9ca3af',textAlign:'center'}}>
              {ql?`Команды не найдены по запросу «${q}»`:'Все команды уже добавлены'}
            </div>
          ):(
            <>
              {(()=>{
                // Build a visual index ignoring non-selectable items so arrow keys align
                let hiIdx=0;
                return list.map((t)=>{
                  const color=TEAM_TYPE_COLOR[t.type]||'#6b7280';
                  const isHi=t.isSelectable&&hiIdx===hi;
                  const myIdx=t.isSelectable?hiIdx:-1;
                  if(t.isSelectable)hiIdx++;
                  return(
                    <div key={t.id}
                      onClick={t.isSelectable?()=>add(t):undefined}
                      onMouseEnter={t.isSelectable?()=>setHi(myIdx):undefined}
                      style={{
                        padding:'6px 12px 6px 8px',
                        display:'flex',alignItems:'center',gap:6,
                        cursor:t.isSelectable?'pointer':'default',
                        background:isHi?'#f3f4f6':'white',
                        opacity:t.isSelectable?1:(t.isSelected?0.55:0.5),
                        borderLeft:`3px solid ${isHi?color:'transparent'}`,
                      }}>
                      {/* indent guides */}
                      <div style={{display:'flex',flexShrink:0,alignSelf:'stretch'}}>
                        {Array.from({length:t.depth}).map((_,d)=>(
                          <div key={d} style={{width:14,borderRight:'1px dashed #e5e7eb',marginRight:0}}/>
                        ))}
                      </div>
                      <div style={{width:3,height:22,borderRadius:2,background:color,flexShrink:0}}/>
                      <span style={{fontSize:9,fontWeight:700,color:color,textTransform:'uppercase',letterSpacing:.4,padding:'2px 5px',background:`${color}12`,borderRadius:3,flexShrink:0}}>{TEAM_TYPE_LABEL[t.type]}</span>
                      <span style={{fontSize:13,fontWeight:t.isSelectable?500:400,color:t.isSelectable?'#111827':'#9ca3af',flex:1,minWidth:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                        {highlight(t.name)}
                      </span>
                      {t.isSelected&&<span style={{fontSize:10,color:'#10b981',fontWeight:600,flexShrink:0}}>✓ выбрана</span>}
                      {!t.isSelected&&!t.isSelectable&&<span style={{fontSize:10,color:'#9ca3af',flexShrink:0}}>группа</span>}
                    </div>
                  );
                });
              })()}
              <div style={{padding:'6px 12px',fontSize:10,color:'#9ca3af',borderTop:'1px solid #f3f4f6',background:'#fafbfc',display:'flex',justifyContent:'space-between',position:'sticky',bottom:0}}>
                <span>↑↓ навигация · Enter — выбрать · Backspace — убрать</span>
                {ql&&<span>{interactable.length} найдено</span>}
              </div>
            </>
          )}
        </div>
      )}
    </div>
  );
}

// ── OWNER STACK (multi-owner avatars) ─────────────────────────────────────────
function OwnerStack({ownerIds,size=24,max=3}){
  if(!ownerIds||ownerIds.length===0) return <span style={{fontSize:11,color:'#9ca3af',fontStyle:'italic'}}>не указан</span>;
  if(ownerIds.length===1) return <UserAvatar userId={ownerIds[0]} size={size} showName/>;
  const visible=ownerIds.slice(0,max);
  const extra=ownerIds.length-visible.length;
  return(
    <div style={{display:'inline-flex',alignItems:'center'}}>
      {visible.map((id,i)=>(
        <div key={id} style={{marginLeft:i===0?0:-6,border:'2px solid white',borderRadius:'50%',zIndex:visible.length-i}}>
          <UserAvatar userId={id} size={size}/>
        </div>
      ))}
      {extra>0&&<div style={{marginLeft:-6,width:size,height:size,borderRadius:'50%',background:'#e5e7eb',display:'flex',alignItems:'center',justifyContent:'center',fontSize:size*0.4,fontWeight:700,color:'#6b7280',border:'2px solid white'}}>+{extra}</div>}
    </div>
  );
}

// ── STATUS STEPPER ────────────────────────────────────────────────────────────
function StatusStepper({teamId,periodId,goals,statuses,onChange,accent}){
  const {status,changedAt}=getTeamStatus(teamId,periodId,goals,statuses);
  const hasGoals=(goals[`${teamId}_${periodId}`]||[]).length>0;
  const curIdx=STATUS_STEPS.findIndex(s=>s.k===status);
  return(
    <div style={{background:'white',borderBottom:'1px solid #e5e7eb',padding:'10px 24px',display:'flex',alignItems:'center',gap:0,flexWrap:'wrap'}}>
      {/* no_goals pill */}
      {!hasGoals&&(
        <span style={{fontSize:12,fontWeight:600,color:'#9ca3af',background:'#f3f4f6',padding:'5px 12px',borderRadius:20,marginRight:8}}>Нет целей</span>
      )}
      {STATUS_STEPS.map((s,i)=>{
        const isCur=s.k===status;
        const isPast=i<curIdx;
        return(
          <React.Fragment key={s.k}>
            {i>0&&<div style={{width:20,height:1,background:'#e5e7eb',flexShrink:0}}/>}
            <button onClick={()=>hasGoals&&onChange(teamId,periodId,s.k)}
              disabled={!hasGoals}
              style={{padding:'5px 12px',borderRadius:20,fontSize:12,fontWeight:600,border:'none',cursor:hasGoals?'pointer':'default',transition:'all .15s',
                background:isCur?accent:isPast?`${accent}15`:'transparent',
                color:isCur?'white':isPast?accent:'#9ca3af',
                outline:'none'}}>
              {s.l}
            </button>
          </React.Fragment>
        );
      })}
      {changedAt&&<span style={{marginLeft:'auto',fontSize:11,color:'#9ca3af'}}>изменён {changedAt}</span>}
      {status==='in_progress'&&<span style={{marginLeft:changedAt?8:0,fontSize:11,fontWeight:600,color:'#ef4444',background:'#fef2f2',padding:'2px 8px',borderRadius:4}}>🔒 Редактирование заблокировано</span>}
      {status==='closed'&&<span style={{marginLeft:changedAt?8:0,fontSize:11,fontWeight:600,color:'#6b7280',background:'#f3f4f6',padding:'2px 8px',borderRadius:4}}>🔒 Период закрыт</span>}
    </div>
  );
}

// ── KR EDIT MODAL (full mode) ─────────────────────────────────────────────────

  const isNew=!kr;

  const set=(k,v)=>setForm(f=>({...f,[k]:v}));

// ── KR ROW ────────────────────────────────────────────────────────────────────
function KRRow({kr,goal,editMode,onSaveKR,accent}){
  const [modal,setModal]=useState(null); // null | 'progress' | 'edit'
  const [showNotes,setShowNotes]=useState(false);
  const progress=calcKRProgress(kr);
  const staleC=kr.updatedDaysAgo>7?'#dc2626':kr.updatedDaysAgo>4?'#d97706':'#10b981';
  let detail=null;
  if(kr.krType==='BOOLEAN') detail=<span style={{fontSize:12,fontWeight:600,color:kr.done?'#16a34a':'#9ca3af'}}>{kr.done?'✓ Выполнено':'○ Не выполнено'}</span>;
  else if(kr.krType==='PROJECT') detail=<span style={{fontSize:12,color:'#6b7280'}}>{(kr.stages||[]).filter(s=>s.done).length}/{(kr.stages||[]).length} шагов</span>;
  else detail=<span style={{fontSize:12,color:'#6b7280',fontVariantNumeric:'tabular-nums'}}>{kr.current} → {kr.target}</span>;
  return(
    <>
      <div style={{padding:'10px 0',borderBottom:'1px solid #f3f4f6'}}>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <div style={{width:26,height:26,borderRadius:6,background:'#f3f4f6',display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,fontWeight:700,color:'#6b7280',flexShrink:0}}>{kr.weight}</div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:13,fontWeight:500,color:'#111827',marginBottom:3,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{kr.name}</div>
            <div style={{display:'flex',alignItems:'center',gap:10}}>
              <div style={{flex:1,maxWidth:160}}><ProgressBar value={progress} h={4} color={accent}/></div>
              <span style={{fontSize:11,fontWeight:700,color:accent,flexShrink:0}}>{progress}%</span>
              {detail}
            </div>
          </div>
          <Badge label={kr.krType} color={KR_TYPE_C[kr.krType]}/>
          <span style={{fontSize:11,color:staleC,flexShrink:0,minWidth:72,textAlign:'right'}}>{kr.updatedDaysAgo===0?'сегодня':`${kr.updatedDaysAgo}д назад`}</span>
          {kr.notes.length>0&&<button onClick={()=>setShowNotes(!showNotes)} style={{fontSize:11,color:'#6b7280',background:'none',border:'none',cursor:'pointer',flexShrink:0}}>📝 {kr.notes.length}</button>}
          {editMode==='full'&&<button onClick={()=>setModal('edit')} style={{padding:'5px 10px',border:'1px solid #e5e7eb',borderRadius:6,background:'white',color:'#374151',fontSize:12,fontWeight:500,cursor:'pointer',flexShrink:0,whiteSpace:'nowrap'}}>Редактировать</button>}
          {editMode==='progress_only'&&<button onClick={()=>setModal('progress')} style={{padding:'5px 10px',border:'1px solid',borderColor:accent,borderRadius:6,background:`${accent}10`,color:accent,fontSize:12,fontWeight:600,cursor:'pointer',flexShrink:0,whiteSpace:'nowrap'}}>Обновить прогресс</button>}
        </div>
        {showNotes&&kr.notes.length>0&&(
          <div style={{marginTop:10,marginLeft:36,borderLeft:'2px solid #f0f1f3',paddingLeft:12}}>
            {kr.notes.map(n=>(
              <div key={n.id} style={{display:'flex',gap:8,marginBottom:8,alignItems:'flex-start'}}>
                <UserAvatar userId={n.userId} size={22}/>
                <div style={{flex:1}}>
                  <div style={{display:'flex',gap:6,alignItems:'baseline',marginBottom:2}}>
                    <span style={{fontSize:11,fontWeight:600,color:'#374151'}}>{userById(n.userId).name}</span>
                    <span style={{fontSize:10,color:'#9ca3af'}}>{n.date}</span>
                  </div>
                  <div style={{fontSize:12,color:'#374151',background:'#f9fafb',padding:'6px 9px',borderRadius:6}}>{n.text}</div>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>
      {modal==='progress'&&<KRProgressModal kr={kr} onSave={saved=>{onSaveKR(saved);setModal(null);}} onClose={()=>setModal(null)} accent={accent}/>}
      {modal==='edit'&&<KREditModal kr={kr} goal={goal} onSave={saved=>{onSaveKR(saved);setModal(null);}} onClose={()=>setModal(null)} accent={accent}/>}
    </>
  );
}

// ── COMMENTS ─────────────────────────────────────────────────────────────────

      <div style={{fontSize:11,fontWeight:700,color:'#9ca3af',textTransform:'uppercase',letterSpacing:.6,marginBottom:12}}>Комментарии</div>

        </div>
      </div>
    </div>
  );
}

// ── GOAL CARD ─────────────────────────────────────────────────────────────────
function GoalCard({goal,editMode,onSaveKR,onAddComment,onEditGoal,onReorderKR,forecast,accent,currentUser,currentTeamId,dragProps}){
  const [showKR,setShowKR]=useState(false);
  const [showCom,setShowCom]=useState(false);
  const [krDrag,setKrDrag]=useState(null);
  const [newKR,setNewKR]=useState(false);
  const [goalDraggable,setGoalDraggable]=useState(false);
  const prog=goalProgress(goal);
  const health=healthOf(prog,goal.updatedDaysAgo>7);
  const hC=HEALTH_COLOR[health];
  const isStale=goal.updatedDaysAgo>7;
  const canEdit=editMode==='full'&&onEditGoal;
  const {isDragging,...rootDrag}=dragProps||{};
  const canReorderGoal=canEdit&&!!dragProps;
  return(
    <div {...rootDrag} draggable={!!(canReorderGoal&&goalDraggable)}
      onDragEnd={(e)=>{setGoalDraggable(false);rootDrag.onDragEnd&&rootDrag.onDragEnd(e);}}
      style={{background:'white',borderRadius:12,marginBottom:12,boxShadow:isDragging?'0 8px 24px rgba(0,0,0,0.15)':'0 1px 3px rgba(0,0,0,0.05)',border:isStale?'1px solid #fde68a':'1px solid #f0f1f3',borderLeft:goal.shared?'3px solid #0891b2':(isStale?'1px solid #fde68a':'1px solid #f0f1f3'),opacity:isDragging?0.6:1,transition:'box-shadow .15s, opacity .15s',position:'relative'}}>
      {canReorderGoal&&<div
        onMouseDown={()=>setGoalDraggable(true)}
        onMouseUp={()=>setGoalDraggable(false)}
        onMouseLeave={()=>setGoalDraggable(false)}
        title="Перетащите для изменения порядка"
        style={{position:'absolute',left:-2,top:'50%',transform:'translateY(-50%)',width:16,height:42,display:'flex',alignItems:'center',justifyContent:'center',cursor:'grab',color:'#d1d5db',fontSize:14,borderRadius:4,userSelect:'none'}}
        onMouseEnter={e=>e.currentTarget.style.color='#6b7280'}>⋮⋮</div>}
      <div style={{padding:'16px 18px'}}>
        <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:8,flexWrap:'wrap'}}>
          <PriBadge p={goal.priority}/>
          <span style={{fontSize:11,color:'#9ca3af',fontWeight:500}}>вес {goal.weight}%</span>
          {goal.shared&&(()=>{
            const isOwner=goal.ownerTeamId?goal.ownerTeamId===currentTeamId:true;
            const teamCount=(goal.sharedTeamIds||[]).length+1;
            return <Badge label={isOwner?`⇄ Общая · ${teamCount} команд`:`⇄ Разделяется из ${teamById(goal.ownerTeamId)?.name||'другой команды'}`} color="#0891b2"/>;
          })()}
          {canEdit&&<Badge label="✏ Редактируется" color="#059669"/>}
          <div style={{flex:1}}/>
          {isStale&&<Badge label="⚠ 9 дней без обновлений" color="#d97706" bg="#fffbeb"/>}
          {/* Owners */}
          <div style={{display:'flex',alignItems:'center',gap:6}}>
            <span style={{fontSize:11,color:'#9ca3af'}}>{(goal.ownerIds||[]).length>1?'владельцы':'владелец'}</span>
            <OwnerStack ownerIds={goal.ownerIds||[]}/>
          </div>
        </div>
        <div onClick={canEdit?()=>onEditGoal(goal):undefined}
          style={{fontSize:15,fontWeight:700,color:'#111827',marginBottom:4,lineHeight:1.35,cursor:canEdit?'pointer':'default',display:'inline-flex',alignItems:'center',gap:6,borderRadius:4,padding:canEdit?'2px 6px':0,marginLeft:canEdit?-6:0,transition:'background .12s'}}
          onMouseEnter={canEdit?e=>{e.currentTarget.style.background='#f3f4f6';}:undefined}
          onMouseLeave={canEdit?e=>{e.currentTarget.style.background='transparent';}:undefined}>
          {goal.title}
          {canEdit&&<span style={{fontSize:11,color:'#9ca3af',fontWeight:500,opacity:0.7}}>✎</span>}
        </div>
        {goal.desc&&<div style={{fontSize:13,color:'#6b7280',marginBottom:12,lineHeight:1.5}}>{goal.desc}</div>}
        {goal.shared&&(()=>{
          const ownerT=goal.ownerTeamId?teamById(goal.ownerTeamId):null;
          const otherTeamIds=(goal.sharedTeamIds||[]).filter(id=>id!==currentTeamId);
          const allTeams=ownerT?[ownerT,...otherTeamIds.map(teamById).filter(Boolean)]:otherTeamIds.map(teamById).filter(Boolean);
          if(allTeams.length===0)return null;
          return(
            <div style={{marginBottom:12,padding:'8px 10px',background:'#ecfeff',borderRadius:8,border:'1px solid #a5f3fc',display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
              <span style={{fontSize:11,color:'#0e7490',fontWeight:600,display:'flex',alignItems:'center',gap:4,flexShrink:0}}>
                <span style={{fontSize:12}}>⇄</span>Общая с:
              </span>
              {allTeams.map(t=>{
                const isOwner=t.id===goal.ownerTeamId;
                const isCurrent=t.id===currentTeamId;
                const color=TEAM_TYPE_COLOR[t.type]||'#0891b2';
                return(
                  <span key={t.id} title={teamPathLabel(t.id)}
                    style={{display:'inline-flex',alignItems:'center',gap:5,padding:'2px 8px',borderRadius:12,background:isCurrent?'#0891b2':'white',border:`1px solid ${isCurrent?'#0891b2':color+'60'}`,fontSize:11,fontWeight:isCurrent?700:500,color:isCurrent?'white':'#164e63'}}>
                    {isOwner&&<span style={{fontSize:9,opacity:0.8}}>★</span>}
                    {t.name}
                    {isCurrent&&<span style={{fontSize:9,opacity:0.85}}>вы</span>}
                  </span>
                );
              })}
              <span style={{fontSize:10,color:'#0e7490',opacity:0.7,marginLeft:'auto'}}>★ владелец</span>
            </div>
          );
        })()}
        <div style={{marginBottom:10}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:5}}>
            <div style={{display:'flex',alignItems:'center',gap:8}}>
              <span style={{fontSize:20,fontWeight:800,color:hC,letterSpacing:-.5}}>{prog}%</span>
              <span style={{fontSize:11,fontWeight:700,color:hC,background:`${hC}15`,padding:'2px 7px',borderRadius:4}}>
                {health==='ahead'?'▲ опережает':health==='on_track'?'✓ в плане':health==='stale'?'⚠ нет обновлений':'▼ отстаёт'}
              </span>
            </div>
            <span style={{fontSize:11,color:'#9ca3af'}}>{goal.updatedDaysAgo===0?'сегодня':`${goal.updatedDaysAgo}д назад`}</span>
          </div>
          <ProgressBar value={prog} forecast={forecast} h={9} color={hC}/>
          <div style={{fontSize:10,color:'#9ca3af',marginTop:3,textAlign:'right'}}>прогноз {forecast}%</div>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:6,flexWrap:'wrap'}}>
          <Badge label={goal.type==='delivery'?'Delivery':'Discovery'} color={goal.type==='delivery'?'#374151':'#7c3aed'}/>
          <Badge label={goal.focus} color={FOCUS_COLORS[goal.focus]||FOCUS_COLORS.DEFAULT}/>
        </div>
      </div>
      <div style={{display:'flex',borderTop:'1px solid #f3f4f6',background:'#fafafa'}}>
        <button onClick={()=>setShowKR(!showKR)} style={{flex:1,padding:'8px 0',border:'none',background:'transparent',cursor:'pointer',fontSize:12,fontWeight:500,color:'#6b7280',display:'flex',alignItems:'center',justifyContent:'center',gap:5}}>
          <span style={{fontSize:9}}>{showKR?'▲':'▼'}</span>{showKR?'Скрыть KR':`KR (${goal.krs.length})`}
        </button>
        <div style={{width:1,background:'#f3f4f6'}}/>
        <button onClick={()=>setShowCom(!showCom)} style={{flex:1,padding:'8px 0',border:'none',background:'transparent',cursor:'pointer',fontSize:12,fontWeight:500,color:goal.comments.length>0?'#374151':'#6b7280',display:'flex',alignItems:'center',justifyContent:'center',gap:5}}>
          {goal.comments.length>0?`💬 ${goal.comments.length}`:'💬 Комментарии'}
        </button>
      </div>
      {showKR&&(
        <div style={{padding:'4px 18px 14px',borderTop:'1px solid #f3f4f6'}}>
          {goal.krs.map(kr=>{
            const canReorderKR=editMode==='full'&&onReorderKR;
            const isKrDrag=krDrag===kr.id;
            return(
              <div key={kr.id}
                draggable={!!canReorderKR}
                onDragStart={canReorderKR?(e)=>{e.stopPropagation();e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain','kr');setKrDrag(kr.id);}:undefined}
                onDragOver={canReorderKR?(e)=>{if(krDrag&&krDrag!==kr.id){e.preventDefault();e.stopPropagation();e.dataTransfer.dropEffect='move';}}:undefined}
                onDrop={canReorderKR?(e)=>{e.preventDefault();e.stopPropagation();if(krDrag&&krDrag!==kr.id){onReorderKR(krDrag,kr.id);}setKrDrag(null);}:undefined}
                onDragEnd={canReorderKR?()=>setKrDrag(null):undefined}
                style={{position:'relative',opacity:isKrDrag?0.5:1,transition:'opacity .15s',marginLeft:canReorderKR?12:0}}>
                {canReorderKR&&<div style={{position:'absolute',left:-12,top:'50%',transform:'translateY(-50%)',width:10,fontSize:11,color:'#d1d5db',cursor:'grab',userSelect:'none'}}>⋮⋮</div>}
                <KRRow kr={kr} goal={goal} editMode={editMode} onSaveKR={saved=>onSaveKR(goal.id,saved)} accent={accent}/>
              </div>
            );
          })}
          {editMode==='full'&&<button onClick={()=>setNewKR(true)} style={{marginTop:10,padding:'7px 14px',border:'1px dashed #d1d5db',borderRadius:7,background:'transparent',color:'#6b7280',fontSize:12,cursor:'pointer'}}>+ Добавить KR</button>}
        </div>
      )}
      {newKR&&<KREditModal kr={null} goal={goal} onSave={saved=>{onSaveKR(goal.id,saved);setNewKR(false);}} onClose={()=>setNewKR(false)} accent={accent}/>}
      {showCom&&(
        <div style={{padding:'0 18px 16px',borderTop:'1px solid #f3f4f6'}}>
          <CommentsPanel comments={goal.comments} onAdd={text=>onAddComment(goal.id,text)} currentUser={currentUser}/>
        </div>
      )}
    </div>
  );
}

// ── SIDEBAR ───────────────────────────────────────────────────────────────────
function SidebarNode({team,depth,selectedId,onSelect,expanded,toggle,period,goals,statuses}){
  const ch=getChildren(team.id);
  const isExp=expanded[team.id]!==false;
  const isSel=selectedId===team.id;
  const prog=teamProgress(team.id,period,goals);
  const {status}=getTeamStatus(team.id,period,goals,statuses);
  const health=healthOf(prog,false);
  const hC=HEALTH_COLOR[health];
  const pad=14+depth*13;
  return(
    <div>
      <div onClick={()=>onSelect(team.id)} style={{display:'flex',alignItems:'center',gap:5,padding:`5px 10px 5px ${pad}px`,cursor:'pointer',background:isSel?'rgba(124,58,237,0.15)':'transparent',borderLeft:isSel?'2px solid #a78bfa':'2px solid transparent',transition:'background .1s'}}
        onMouseEnter={e=>{if(!isSel)e.currentTarget.style.background='rgba(255,255,255,0.06)';}}
        onMouseLeave={e=>{if(!isSel)e.currentTarget.style.background='transparent';}}>
        {ch.length>0?<span onClick={e=>{e.stopPropagation();toggle(team.id);}} style={{color:'#4b5563',fontSize:9,width:11,textAlign:'center',flexShrink:0,lineHeight:1}}>{isExp?'▾':'▸'}</span>:<span style={{width:11}}/>}
        <span style={{width:6,height:6,borderRadius:'50%',background:hC,flexShrink:0}}/>
        <span style={{flex:1,fontSize:depth===0?13:depth===1?12.5:12,fontWeight:depth===0?700:depth===1?500:400,color:isSel?'#c4b5fd':depth===0?'#f1f5f9':depth===1?'#cbd5e1':depth===2?'#94a3b8':'#64748b',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',lineHeight:1.3}}>{team.name}</span>
        {prog!==null&&<span style={{fontSize:10,color:isSel?'#c4b5fd':hC,flexShrink:0,fontVariantNumeric:'tabular-nums',fontWeight:600}}>{prog}%</span>}
        {status==='in_progress'&&!isSel&&<span style={{fontSize:9,color:'#f87171',flexShrink:0}}>●</span>}
      </div>
      {isExp&&ch.map(c=><SidebarNode key={c.id} team={c} depth={depth+1} selectedId={selectedId} onSelect={onSelect} expanded={expanded} toggle={toggle} period={period} goals={goals} statuses={statuses}/>)}
    </div>
  );
}

// ── CHILD CARD ────────────────────────────────────────────────────────────────
function ChildCard({team,period,goals,statuses,onSelect}){
  const gs=goals[`${team.id}_${period}`]||[];
  const prog=teamProgress(team.id,period,goals);
  const health=healthOf(prog,false);
  const hC=HEALTH_COLOR[health];
  const {status}=getTeamStatus(team.id,period,goals,statuses);
  const p01=gs.filter(g=>g.priority==='P0'||g.priority==='P1').length;
  return(
    <div onClick={()=>onSelect(team.id)} style={{background:'white',borderRadius:10,padding:'14px 16px',cursor:'pointer',border:'1px solid #f0f1f3',boxShadow:'0 1px 2px rgba(0,0,0,0.05)',transition:'all .14s'}}
      onMouseEnter={e=>{e.currentTarget.style.boxShadow='0 4px 14px rgba(0,0,0,0.1)';e.currentTarget.style.transform='translateY(-1px)';}}
      onMouseLeave={e=>{e.currentTarget.style.boxShadow='0 1px 2px rgba(0,0,0,0.05)';e.currentTarget.style.transform='none';}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:10,gap:8}}>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:13,fontWeight:600,color:'#111827',lineHeight:1.3,marginBottom:team.leadId?4:0,overflow:'hidden',textOverflow:'ellipsis'}}>{team.name}</div>
          {team.leadId&&(()=>{const lead=userById(team.leadId);return(
            <div style={{display:'flex',alignItems:'center',gap:5,fontSize:11,color:'#6b7280'}} title={`${lead.name} · ${lead.role}`}>
              <UserAvatar userId={lead.id} size={16}/>
              <span style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{lead.name.split(' ')[0]} {lead.name.split(' ')[1]?.[0]}.</span>
            </div>
          );})()}
        </div>
        <span style={{fontSize:10,fontWeight:700,color:hC,background:`${hC}15`,padding:'2px 6px',borderRadius:4,flexShrink:0}}>{HEALTH_LABEL[health]}</span>
      </div>
      {prog!==null?(
        <>
          <div style={{display:'flex',justifyContent:'space-between',marginBottom:5}}>
            <span style={{fontSize:11,color:'#9ca3af'}}>{gs.length} целей · {status==='in_progress'?'В работе':status==='forming'?'Черновик':status==='ready'?'К валидации':'Закрыт'}</span>
            <span style={{fontSize:14,fontWeight:800,color:hC}}>{prog}%</span>
          </div>
          <ProgressBar value={prog} h={5} color={hC}/>
          {p01>0&&<div style={{marginTop:6,fontSize:11,color:'#d97706',fontWeight:500}}>● {p01} приоритетных P0–P1</div>}
        </>
      ):(
        <div style={{fontSize:12,color:'#9ca3af',fontStyle:'italic'}}>Цели не добавлены</div>
      )}
    </div>
  );
}

// ── CLUSTER VIEW ──────────────────────────────────────────────────────────────
function ClusterView({team,period,goals,statuses,onSelect,forecast}){
  const children=getChildren(team.id);
  const withGoals=children.filter(c=>teamProgress(c.id,period,goals)!==null);
  const avg=withGoals.length?Math.round(withGoals.reduce((s,c)=>s+teamProgress(c.id,period,goals),0)/withGoals.length):0;
  const health=healthOf(avg,false);
  const hC=HEALTH_COLOR[health];
  const units=children.filter(c=>c.type==='unit'||c.type==='group');
  const direct=children.filter(c=>c.type==='team'||c.type==='squad');
  return(
    <div>
      <div style={{background:'white',borderRadius:12,padding:'20px 24px',marginBottom:20,boxShadow:'0 1px 3px rgba(0,0,0,0.05)',border:'1px solid #f0f1f3',display:'flex',alignItems:'center',gap:24}}>
        <div style={{minWidth:80}}>
          <div style={{fontSize:11,color:'#9ca3af',fontWeight:500,marginBottom:4,textTransform:'uppercase',letterSpacing:.5}}>Прогресс</div>
          <div style={{fontSize:34,fontWeight:800,color:hC,letterSpacing:-1}}>{avg}%</div>
        </div>
        <div style={{flex:1}}>
          <div style={{display:'flex',justifyContent:'space-between',marginBottom:6}}>
            <span style={{fontSize:12,color:'#9ca3af'}}>{withGoals.length} из {children.length} с целями</span>
            <span style={{fontSize:12,fontWeight:700,color:hC}}>{HEALTH_LABEL[health]}</span>
          </div>
          <ProgressBar value={avg} forecast={forecast} h={10} color={hC}/>
          <div style={{fontSize:10,color:'#9ca3af',marginTop:4}}>прогноз {forecast}%</div>
        </div>
      </div>
      {units.map(u=>{
        const uch=getChildren(u.id);
        const up=teamProgress(u.id,period,goals);
        return(
          <div key={u.id} style={{marginBottom:20}}>
            <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:10}}>
              <span style={{fontSize:11,fontWeight:700,color:'#6b7280',textTransform:'uppercase',letterSpacing:.5}}>{u.type==='group'?'Группа':'Юнит'} · {u.name}</span>
              {up!==null&&<span style={{fontSize:12,fontWeight:700,color:HEALTH_COLOR[healthOf(up,false)]}}>{up}%</span>}
              <button onClick={()=>onSelect(u.id)} style={{marginLeft:'auto',fontSize:11,color:'#2563eb',background:'none',border:'none',cursor:'pointer'}}>Открыть →</button>
            </div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(190px,1fr))',gap:10}}>
              {uch.map(t=><ChildCard key={t.id} team={t} period={period} goals={goals} statuses={statuses} onSelect={onSelect}/>)}
            </div>
          </div>
        );
      })}
      {direct.length>0&&<div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(190px,1fr))',gap:10}}>
        {direct.map(t=><ChildCard key={t.id} team={t} period={period} goals={goals} statuses={statuses} onSelect={onSelect}/>)}
      </div>}
    </div>
  );
}

// ── CHECK-IN ──────────────────────────────────────────────────────────────────
function CheckInPanel({period,goals,statuses,onClose,onSaveKR,forecast,accent,currentUser}){
  const [filter,setFilter]=useState('all'); // 'all' | 'stale' | 'behind'
  const allGs=Object.entries(goals).filter(([k])=>k.endsWith(period)).flatMap(([,gs])=>gs);
  const stale=allGs.filter(g=>g.updatedDaysAgo>7);
  const behind=allGs.filter(g=>g.updatedDaysAgo<=7&&goalProgress(g)<forecast-5);
  const total=stale.length+behind.length;
  const visibleStale=filter==='behind'?[]:stale;
  const visibleBehind=filter==='stale'?[]:behind;
  const visibleTotal=visibleStale.length+visibleBehind.length;
  const chip=(active,bg,activeBg,color,onClick,children)=>(
    <button onClick={onClick}
      style={{border:'none',cursor:'pointer',background:active?activeBg:bg,borderRadius:7,padding:'6px 12px',fontSize:12,fontWeight:600,color,display:'inline-flex',alignItems:'center',gap:6,outline:active?`2px solid ${color}`:'none',outlineOffset:-1,transition:'all .12s',fontFamily:'inherit'}}>
      {children}
    </button>
  );
  return(
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.55)',zIndex:200,display:'flex',justifyContent:'flex-end'}} onClick={onClose}>
      <div onClick={e=>e.stopPropagation()} style={{width:600,background:'#edf0f4',height:'100%',overflow:'auto',boxShadow:'-8px 0 32px rgba(0,0,0,0.2)',display:'flex',flexDirection:'column'}}>
        <div style={{padding:'20px 24px',background:'#111827',flexShrink:0}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
            <div><div style={{fontSize:17,fontWeight:700,color:'white',marginBottom:3}}>⚡ Health Check-in</div>
              <div style={{fontSize:13,color:'#94a3b8'}}>{total>0?`${total} целей требуют внимания`:'Всё в порядке'}</div></div>
            <button onClick={onClose} style={{background:'rgba(255,255,255,0.1)',border:'none',color:'white',borderRadius:7,padding:'6px 12px',cursor:'pointer',fontSize:13}}>✕</button>
          </div>
          {total>0&&<div style={{display:'flex',gap:8,marginTop:14,alignItems:'center',flexWrap:'wrap'}}>
            {chip(filter==='all','rgba(255,255,255,0.06)','rgba(255,255,255,0.18)','#e5e7eb',()=>setFilter('all'),<>Все · {total}</>)}
            {stale.length>0&&chip(filter==='stale','rgba(239,68,68,0.15)','rgba(239,68,68,0.35)','#fca5a5',()=>setFilter(f=>f==='stale'?'all':'stale'),<>🕐 Нет обновлений · {stale.length}</>)}
            {behind.length>0&&chip(filter==='behind','rgba(245,158,11,0.15)','rgba(245,158,11,0.35)','#fcd34d',()=>setFilter(f=>f==='behind'?'all':'behind'),<>▼ Отстают · {behind.length}</>)}
            {filter!=='all'&&<button onClick={()=>setFilter('all')} style={{background:'none',border:'none',color:'#94a3b8',fontSize:11,cursor:'pointer',textDecoration:'underline',fontFamily:'inherit'}}>сбросить</button>}
          </div>}
        </div>
        <div style={{flex:1,overflow:'auto',padding:'18px'}}>
          {total===0&&<div style={{textAlign:'center',padding:'80px 0'}}><div style={{fontSize:40,marginBottom:12}}>✅</div><div style={{fontSize:15,fontWeight:600,color:'#374151'}}>Всё актуально</div></div>}
          {total>0&&visibleTotal===0&&<div style={{textAlign:'center',padding:'60px 0',color:'#6b7280',fontSize:13}}>По выбранному фильтру ничего нет</div>}
          {visibleStale.length>0&&(
            <div style={{marginBottom:16}}>
              <div style={{fontSize:11,fontWeight:700,color:'#dc2626',textTransform:'uppercase',letterSpacing:.6,marginBottom:8,display:'flex',alignItems:'center',gap:6}}>🕐 Нет обновлений · {visibleStale.length}</div>
              {visibleStale.map(g=><GoalCard key={g.id} goal={g} editMode="progress_only" onSaveKR={onSaveKR} onAddComment={()=>{}} forecast={forecast} accent={accent} currentUser={currentUser}/>)}
            </div>
          )}
          {visibleBehind.length>0&&(
            <div>
              <div style={{fontSize:11,fontWeight:700,color:'#d97706',textTransform:'uppercase',letterSpacing:.6,marginBottom:8,display:'flex',alignItems:'center',gap:6}}>▼ Отстают · {visibleBehind.length}</div>
              {visibleBehind.map(g=><GoalCard key={g.id} goal={g} editMode="progress_only" onSaveKR={onSaveKR} onAddComment={()=>{}} forecast={forecast} accent={accent} currentUser={currentUser}/>)}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// ── TWEAKS ────────────────────────────────────────────────────────────────────

// ── APP ───────────────────────────────────────────────────────────────────────
function App(){
  const [currentUser,setCurrentUser]=useState(null);
  const [tweaks,setTweaks]=useState(TWEAK_DEFAULTS);
  const [tweaksVis,setTweaksVis]=useState(false);
  const [period,setPeriod]=useState('y26q1');
  const [selId,setSelId]=useState('u1');
  const [expanded,setExpanded]=useState({c1:true,u1:true,sg1:true,sg2:false,t1:false,c2:false});
  const [checkIn,setCheckIn]=useState(false);
  const [goalModal,setGoalModal]=useState(null); // null | 'new' | goal object
  const [dragState,setDragState]=useState({kind:null,srcId:null});
  const [goals,setGoals]=useState(INIT_GOALS);
  const [statuses,setStatuses]=useState(INIT_STATUSES);

  useEffect(()=>{
    const h=e=>{
      if(e.data?.type==='__activate_edit_mode')setTweaksVis(true);
      if(e.data?.type==='__deactivate_edit_mode')setTweaksVis(false);
    };
    window.addEventListener('message',h);
    window.parent.postMessage({type:'__edit_mode_available'},'*');
    return()=>window.removeEventListener('message',h);
  },[]);

  const toggle=useCallback((id)=>setExpanded(m=>({...m,[id]:!m[id]})),[]);
  const selTeam=TEAMS.find(t=>t.id===selId);
  const isLeaf=selTeam&&getChildren(selId).length===0;
  const teamGoals=goals[`${selId}_${period}`]||[];
  const prog=teamProgress(selId,period,goals);
  const {status,changedAt}=getTeamStatus(selId,period,goals,statuses);
  const editMode=getEditMode(status);
  const hC=HEALTH_COLOR[healthOf(prog,false)];

  const allGs=Object.entries(goals).filter(([k])=>k.endsWith(period)).flatMap(([,gs])=>gs);
  const attn=allGs.filter(g=>g.updatedDaysAgo>7||goalProgress(g)<tweaks.forecastPct-5).length;

  const handleChangeStatus=useCallback((tid,pid,newStatus)=>{
    setStatuses(prev=>({...prev,[`${tid}_${pid}`]:{status:newStatus,changedAt:todayStr()}}));
  },[]);

  const handleSaveGoal=useCallback((saved)=>{
    setGoals(prev=>{
      const key=`${selId}_${period}`;
      const gs=prev[key]||[];
      const exists=gs.find(g=>g.id===saved.id);
      const next=exists?gs.map(g=>g.id===saved.id?saved:g):[...gs,saved];
      return{...prev,[key]:next};
    });
    setStatuses(prev=>{
      const key=`${selId}_${period}`;
      if(!prev[key]||prev[key].status==='no_goals')
        return{...prev,[key]:{status:'forming',changedAt:todayStr()}};
      return prev;
    });
    setGoalModal(null);
  },[selId,period]);

  const handleReorderGoals=useCallback((fromId,toId)=>{
    if(!fromId||!toId||fromId===toId)return;
    setGoals(prev=>{
      const key=`${selId}_${period}`;
      const gs=[...(prev[key]||[])];
      const fi=gs.findIndex(g=>g.id===fromId),ti=gs.findIndex(g=>g.id===toId);
      if(fi<0||ti<0)return prev;
      const [moved]=gs.splice(fi,1);
      gs.splice(ti,0,moved);
      return{...prev,[key]:gs};
    });
  },[selId,period]);

  const handleReorderKRs=useCallback((goalId,fromId,toId)=>{
    if(!fromId||!toId||fromId===toId)return;
    setGoals(prev=>{
      const key=`${selId}_${period}`;
      return{...prev,[key]:(prev[key]||[]).map(g=>{
        if(g.id!==goalId)return g;
        const krs=[...g.krs];
        const fi=krs.findIndex(k=>k.id===fromId),ti=krs.findIndex(k=>k.id===toId);
        if(fi<0||ti<0)return g;
        const [moved]=krs.splice(fi,1);
        krs.splice(ti,0,moved);
        return{...g,krs};
      })};
    });
  },[selId,period]);

  const handleSaveKR=useCallback((goalId,savedKR,teamId=selId)=>{
    setGoals(prev=>{
      const key=`${teamId}_${period}`;
      const gs=(prev[key]||[]).map(g=>{
        if(g.id!==goalId)return g;
        const ex=g.krs.find(k=>k.id===savedKR.id);
        const krs=ex?g.krs.map(k=>k.id===savedKR.id?savedKR:k):[...g.krs,savedKR];
        return{...g,krs,updatedDaysAgo:0};
      });
      return{...prev,[key]:gs};
    });
  },[selId,period]);

  const handleAddComment=useCallback((goalId,text)=>{
    setGoals(prev=>{
      const key=`${selId}_${period}`;
      return{...prev,[key]:(prev[key]||[]).map(g=>g.id===goalId?{...g,comments:[...g.comments,{id:`c${Date.now()}`,userId:currentUser?.id||'u1',date:todayStr(),text}]}:g)};
    });
  },[selId,period,currentUser]);

  if(!currentUser) return <LoginScreen onLogin={setCurrentUser} accent={tweaks.accentColor}/>;

  return(
    <div style={{display:'flex',height:'100vh',overflow:'hidden',fontFamily:'Inter,sans-serif'}}>
      {/* SIDEBAR */}
      <div style={{width:252,background:'#0c1220',display:'flex',flexDirection:'column',flexShrink:0,overflow:'hidden'}}>
        <div style={{padding:'12px 14px',borderBottom:'1px solid rgba(255,255,255,0.06)',display:'flex',alignItems:'center',gap:10}}>
          <div style={{fontSize:14,fontWeight:800,color:'white',letterSpacing:-.3,flex:1}}>OKR Tracker</div>
          <HeaderUserMenu user={currentUser} onLogout={()=>setCurrentUser(null)}/>
        </div>
        <div style={{padding:'9px 12px',borderBottom:'1px solid rgba(255,255,255,0.06)'}}>
          <div style={{fontSize:10,color:'#374151',fontWeight:600,textTransform:'uppercase',letterSpacing:.6,marginBottom:4}}>Период</div>
          <select value={period} onChange={e=>setPeriod(e.target.value)} style={{width:'100%',background:'rgba(255,255,255,0.07)',border:'1px solid rgba(255,255,255,0.1)',color:'#e5e7eb',borderRadius:6,padding:'6px 8px',fontSize:13,outline:'none',cursor:'pointer',fontFamily:'Inter,sans-serif'}}>
            {PERIODS.map(p=><option key={p.id} value={p.id} style={{background:'#1f2937'}}>{p.label} · {p.start.slice(0,7)} – {p.end.slice(0,7)}</option>)}
          </select>
        </div>
        <div style={{flex:1,overflow:'auto',padding:'6px 0'}}>
          {TEAMS.filter(t=>!t.parentId).map(t=><SidebarNode key={t.id} team={t} depth={0} selectedId={selId} onSelect={setSelId} expanded={expanded} toggle={toggle} period={period} goals={goals} statuses={statuses}/>)}
        </div>
        <div style={{padding:'10px 12px',borderTop:'1px solid rgba(255,255,255,0.06)'}}>
          <button onClick={()=>setCheckIn(true)} style={{width:'100%',padding:'9px 12px',borderRadius:8,background:attn>0?'rgba(239,68,68,0.85)':'rgba(255,255,255,0.07)',border:'none',color:'white',fontSize:13,fontWeight:700,cursor:'pointer',display:'flex',justifyContent:'center',alignItems:'center',gap:8}}>
            ⚡ Health Check-in
            {attn>0&&<span style={{background:'rgba(255,255,255,0.22)',borderRadius:10,padding:'1px 8px',fontSize:11}}>{attn}</span>}
          </button>
        </div>
      </div>

      {/* MAIN */}
      <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden',background:'#edf0f4'}}>
        {/* header */}
        <div style={{padding:'0 24px',background:'white',borderBottom:'1px solid #e5e7eb',display:'flex',alignItems:'center',height:54,gap:14,flexShrink:0}}>
          <span style={{fontSize:17,fontWeight:800,color:'#111827',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{selTeam?.name}</span>
          {selTeam?.leadId&&(()=>{const lead=userById(selTeam.leadId);return(
            <div title={`Руководитель: ${lead.name} · ${lead.role}`} style={{display:'inline-flex',alignItems:'center',gap:7,padding:'4px 10px 4px 4px',background:'#f3f4f6',borderRadius:20,fontSize:12,color:'#374151',cursor:'default',flexShrink:0}}>
              <UserAvatar userId={lead.id} size={22}/>
              <span style={{fontWeight:500,whiteSpace:'nowrap'}}>{lead.name.split(' ')[0]} {lead.name.split(' ')[1]?.[0]}.</span>
              <span style={{color:'#9ca3af',fontSize:11}}>· лид</span>
            </div>
          );})()}
          <div style={{flex:1}}/>
          {isLeaf&&prog!==null&&(
            <div style={{display:'flex',alignItems:'center',gap:8}}>
              <div style={{width:140}}><ProgressBar value={prog} forecast={tweaks.forecastPct} h={6} color={hC}/></div>
              <span style={{fontSize:13,fontWeight:700,color:hC,flexShrink:0}}>{prog}%</span>
            </div>
          )}
          {editMode==='full'&&<button onClick={()=>setGoalModal('new')} style={{padding:'7px 14px',borderRadius:8,background:tweaks.accentColor,color:'white',border:'none',fontSize:13,fontWeight:600,cursor:'pointer',flexShrink:0}}>+ Добавить цель</button>}
        </div>

        {/* status stepper */}
        <StatusStepper teamId={selId} periodId={period} goals={goals} statuses={statuses} onChange={handleChangeStatus} accent={tweaks.accentColor}/>

        {/* body */}
        <div style={{flex:1,overflow:'auto',padding:'20px 24px'}}>
          {!isLeaf&&<ClusterView team={selTeam} period={period} goals={goals} statuses={statuses} onSelect={setSelId} forecast={tweaks.forecastPct}/>}
          {(isLeaf||teamGoals.length>0)&&(
            <>
              {!isLeaf&&teamGoals.length>0&&<div style={{fontSize:11,fontWeight:700,color:'#9ca3af',textTransform:'uppercase',letterSpacing:.6,marginTop:24,marginBottom:12}}>Цели этого узла</div>}
              {teamGoals.length===0&&isLeaf?(
                <div style={{textAlign:'center',padding:'80px 0',color:'#9ca3af'}}>
                  <div style={{fontSize:36,marginBottom:12}}>📋</div>
                  <div style={{fontSize:15,fontWeight:600,color:'#6b7280',marginBottom:6}}>Цели не добавлены</div>
                  <div style={{fontSize:13,marginBottom:20}}>Начните период с постановки OKR</div>
                  {editMode==='full'&&<button onClick={()=>setGoalModal('new')} style={{padding:'10px 22px',borderRadius:10,background:tweaks.accentColor,color:'white',border:'none',fontSize:14,fontWeight:700,cursor:'pointer',boxShadow:`0 4px 12px ${tweaks.accentColor}40`}}>+ Создать первую цель</button>}
                </div>
              ):(
                teamGoals.map(g=><GoalCard key={g.id} goal={g} editMode={editMode}
                  onSaveKR={(gid,kr)=>handleSaveKR(gid,kr,selId)}
                  onAddComment={handleAddComment}
                  onEditGoal={setGoalModal}
                  onReorderKR={(fid,tid)=>handleReorderKRs(g.id,fid,tid)}
                  forecast={tweaks.forecastPct} accent={tweaks.accentColor} currentUser={currentUser} currentTeamId={selId}
                  dragProps={editMode==='full'?{
                    isDragging:dragState.kind==='goal'&&dragState.srcId===g.id,
                    onDragStart:(e)=>{e.dataTransfer.effectAllowed='move';setDragState({kind:'goal',srcId:g.id});},
                    onDragOver:(e)=>{if(dragState.kind==='goal'&&dragState.srcId!==g.id){e.preventDefault();e.dataTransfer.dropEffect='move';}},
                    onDrop:(e)=>{e.preventDefault();if(dragState.kind==='goal'){handleReorderGoals(dragState.srcId,g.id);setDragState({kind:null,srcId:null});}},
                    onDragEnd:()=>setDragState({kind:null,srcId:null}),
                  }:null}/>)
              )}
            </>
          )}
        </div>
      </div>

      {checkIn&&<CheckInPanel period={period} goals={goals} statuses={statuses} onClose={()=>setCheckIn(false)} onSaveKR={(gid,kr)=>{}} forecast={tweaks.forecastPct} accent={tweaks.accentColor} currentUser={currentUser}/>}
      {goalModal&&<GoalModal teamId={selId} period={period} existingGoals={teamGoals} currentUser={currentUser} onSave={handleSaveGoal} onClose={()=>setGoalModal(null)} accent={tweaks.accentColor} goal={goalModal==='new'?null:goalModal}/>}
      <TweaksPanel tweaks={tweaks} setTweaks={setTweaks} visible={tweaksVis}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
