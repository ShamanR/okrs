{{define "no-membership"}}
<!DOCTYPE html>
<html lang="ru">
<head>
{{template "spa-head" .}}
<title>Нет доступа · OKR</title>
<link rel="stylesheet" href="/static/sidebar.css">
<style>
html,body,#root{height:100%;font-size:14px}
input{font-size:14px}
.topbar{display:flex;align-items:center;gap:12px;height:56px;padding:0 16px;background:#fff;border-bottom:1px solid var(--border)}
.topbar__logo{font-weight:700;color:#0f172a}
.na-wrap{max-width:560px;margin:48px auto;padding:0 16px}
.na-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:0 1px 3px rgba(15,23,42,0.04);padding:24px}
.na-card h1{font-size:20px;margin-bottom:.5rem}
.na-card p{color:var(--text-body);margin-bottom:1rem}
.na-form{display:flex;gap:8px;align-items:center;margin-top:1rem}
.na-form input{flex:1;padding:7px 11px;border:1.5px solid var(--border);border-radius:var(--radius-md)}
.na-form button{padding:7px 16px;border:none;border-radius:var(--radius-md);background:var(--link);color:#fff;font-weight:600;cursor:pointer}
.na-msg{margin-top:.75rem;font-size:13px}
.na-msg.err{color:#b91c1c}
.na-msg.ok{color:#047857}
</style>
</head>
<body>
<div id="root"><div class="loading-screen">Загрузка…</div></div>
<div id="na-msg-src" hidden>{{.NoAccessMessage}}</div>
{{template "spa-vendor" .}}
<script type="text/babel" src="/static/api.js" data-presets="react"></script>
<script type="text/babel" src="/static/markdown.js" data-presets="react"></script>
<script type="text/babel" src="/static/notifications.js" data-presets="react"></script>
<script type="text/babel" src="/static/sidebar.js" data-presets="react"></script>
<script type="text/babel" src="/static/no_access.js" data-presets="react"></script>
</body>
</html>
{{end}}
